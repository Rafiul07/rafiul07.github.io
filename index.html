<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>MESS HISAB PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0a0a12;--card:#15152a;--card2:#1c1c38;--tx:#f1f1f7;--sub:#8b8ba7;--bd:#262643;--inp:#0d0d1a;--p:#a855f7;--s:#22d3ee;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--blue:#60a5fa}
body.light{--pos:#047857;--ok:#047857;--bad:#dc2626;--bg:#f2f4fa;--card:#ffffff;--card2:#f5f6fb;--tx:#14141f;--sub:#60647a;--bd:#e2e5ee;--inp:#f5f6fa}
body.light .ok{background:#6ee7b7;color:#064e3b}
body.light .bad{background:#fca5a5;color:#7f1d1d}
*{box-sizing:border-box;margin:0;padding:0}
/* thin scrollbar in the app colour (Firefox + Chrome/Safari) */
html{scrollbar-width:thin;scrollbar-color:var(--p) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--p);border-radius:10px;opacity:.75}
::-webkit-scrollbar-thumb:hover{opacity:1}
body{font-family:'Noto Sans Bengali',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:calc(190px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.hidden{display:none!important}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;color:var(--tx);background:var(--card2);transition:transform .08s,opacity .2s}
button:active{transform:scale(.97)}
.pri{background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12}
.ok{background:var(--ok);color:#06150e}
.warn{background:var(--warn);color:#2a1d00}
.bad{background:var(--bad);color:#2a0606}
.ghost{background:transparent;border:1px solid var(--bd)}
input,select,textarea{font:inherit;width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:16px;margin-top:6px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{font-weight:900;letter-spacing:.5px;font-size:17px;background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:11px;font-weight:700;letter-spacing:.6px;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--sub);border:1px solid var(--bd)}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.3px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,rgba(168,85,247,.22),rgba(34,211,238,.12));border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px}
.hero .big{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.kpi small{display:block;color:var(--sub);font-size:12px;margin-bottom:6px}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:999px;font-weight:700;white-space:nowrap;color:#06150e}
.b-ok{background:var(--ok)}.b-bad{background:var(--bad);color:#2a0606}.b-s{background:var(--s)}.b-p{background:var(--p);color:#0a0a12}
.b-sub{background:var(--blue);color:#06142a}.b-warn{background:var(--warn);color:#2a1d00}
.lbl{font-size:12.5px;color:var(--sub);font-weight:700;margin:14px 0 2px}
.lbl:first-child{margin-top:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--inp);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-top:8px}
.seg button{background:transparent;color:var(--sub);padding:9px 6px;font-size:13.5px;border-radius:10px}
.seg button.on{background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 0;border-top:1px solid var(--bd);background:none;color:var(--tx);border-radius:0;text-align:left;font-weight:600}
.entry{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.entry:first-child{border-top:0;padding-top:0}
.thumb{width:60px;height:60px;border-radius:14px;object-fit:cover;border:1px solid var(--bd);flex-shrink:0;background:var(--inp);cursor:pointer}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{padding:7px 11px;font-size:12.5px;border-radius:10px}
.barRow{padding:12px 0;border-top:1px solid var(--bd)}
.barRow:first-child{border-top:0;padding-top:0}
.track{height:10px;background:var(--inp);border:1px solid var(--bd);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.fill{height:100%;background:linear-gradient(90deg,var(--p),var(--s));border-radius:999px;transition:width .5s}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;background:var(--card);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;padding:6px 0;border-radius:12px}
.nav button.on{color:var(--s)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:380px;padding:24px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay img{max-width:100%;max-height:80vh;border-radius:14px;transition:transform .2s}
.viewBar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.viewBar button{background:var(--card)}
.sheetWrap{position:fixed;inset:0;z-index:2147483600;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px 16px 120px}
.sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet .row button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:var(--card2);border:1px solid var(--bd);padding:10px 18px;border-radius:999px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.toast.err{border-color:var(--bad);color:var(--bad)}
.empty{text-align:center;padding:22px 8px;color:var(--sub)}
.mcard .row input{margin-top:0}
.mgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.mdGroup{margin-top:16px}
.mdHead{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);margin:0 0 8px 2px}
.mdHint{font-size:11px;opacity:.7}
.mdAct{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;text-align:left;min-height:48px}
.mdAct small{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
.mdDanger{padding-top:12px;border-top:1px dashed var(--bd)}
.mdDel{width:100%;min-height:46px;border:1px solid var(--bad);background:var(--bad);color:#fff;border-radius:14px;font-weight:800;font-size:15px}
#mdSave:disabled{opacity:.45;filter:grayscale(.3)}
.mrEdit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.mgAct{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mgAct button{min-height:44px;padding:8px 12px;font-size:13px;font-weight:800;border-radius:12px;line-height:1;border:1px solid var(--bd);background:transparent}
.mgAct .ok{color:var(--ok)}
.mgAct .bad{color:var(--bad)}
.mgAct .ghost{color:var(--blue)}
body.light .mgAct .ghost{color:#2563eb}
.mrEdit label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--sub)}
.mrEdit input{width:100%;min-width:0;min-height:40px;padding:6px 8px;font-size:14px}
#memberList .mrEdit .mrSave{min-height:36px;padding:6px 12px;font-size:13px;background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12;border:0;border-radius:12px;font-weight:800;grid-column:1/-1;min-height:40px}
#memberList .mrEdit .mrSave:disabled{opacity:.4;filter:grayscale(.3)}
body.light #memberList .mrEdit .mrSave{color:#fff;background:linear-gradient(135deg,#7c3aed,#0891b2)}
.mf{display:flex;flex-direction:column;gap:4px;min-width:0}
.mf span{font-size:12px;font-weight:600;opacity:.7}
.mf input{width:100%;min-width:0}
.mcard .pri.grow{flex:1}
.kpis.three{grid-template-columns:repeat(3,1fr);gap:8px}
.kpis.three .kpi{padding:12px 10px}
.kpis.three .kpi b{font-size:clamp(14px,4.2vw,18px);overflow-wrap:anywhere}
input[type=file]{padding:9px;font-size:14px;color:var(--sub)}
input[type=file]::file-selector-button{font:inherit;font-weight:700;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-right:10px;cursor:pointer}
.sample{margin-top:14px;padding:14px;border-radius:14px;background:var(--inp);border:1px dashed var(--bd);color:var(--tx)}
.iconBox{width:38px;height:38px;border-radius:12px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--card2);color:var(--sub);white-space:nowrap}
@media(min-width:700px){.wrap{padding:20px}}

/* ===== mobile polish ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:15.5px;line-height:1.5}
.top{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.card{padding:16px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
body.light .card{box-shadow:0 1px 2px rgba(20,20,40,.06),0 6px 18px rgba(20,20,40,.07)}
.card h3{font-size:13px;letter-spacing:.2px;margin-bottom:14px}
.kpi{padding:14px}
.kpi b{font-size:clamp(16px,4.8vw,20px)}
.hero{padding:18px}
.hero .big{font-size:clamp(24px,8vw,32px)}
.thumb{width:56px;height:56px;border-radius:12px}
button{min-height:42px}
.acts button{min-height:36px;padding:8px 12px;font-size:12.5px}
.entry .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
#pgAdmin .entry .thumb{width:76px;height:76px;border-radius:14px}
.entry .acts button{flex:0 0 auto;min-width:0;min-height:44px;font-size:13px;font-weight:800;border-radius:12px;padding:8px 12px;line-height:1}
.entry .acts .sub{flex-basis:100%}
.entry .acts .ok{background:transparent;border:1px solid var(--bd);color:var(--ok)}
.entry .acts .bad{background:transparent;border:1px solid var(--bd);color:var(--bad)}
.entry .acts .ghost{background:transparent;border:1px solid var(--bd);color:var(--blue)}
.chip.s-submitted:not(.on){color:var(--blue)}
.chip.s-approved:not(.on){color:var(--ok)}
.chip.s-locked:not(.on){color:var(--sub)}
body.light .chip.s-submitted:not(.on){color:#2563eb}
.entry.st-approved{box-shadow:inset 3px 0 0 var(--ok)}
.entry.st-submitted{box-shadow:inset 3px 0 0 var(--blue)}
.entry.st-needs_fix{box-shadow:inset 3px 0 0 var(--warn)}
.dayHead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;padding:6px 2px;border-bottom:1px solid var(--bd);font-weight:700;font-size:13px}
.dayHead .num{font-weight:800}
.filterBar{margin:0 0 12px;padding:0 0 12px;border-bottom:1px solid var(--bd)}
.entriesHead{cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:40px;user-select:none}
.entriesHead h3{margin:0;color:var(--tx);font-size:clamp(16px,4.6vw,18px);font-weight:800}
.entriesArrow{font-size:28px;font-weight:700;line-height:1;color:var(--s);opacity:1;transition:transform .2s;display:inline-block}
details.sec>summary::after{color:var(--s);opacity:1}
/* same look as the Settings rows: soft gradient card, left accent bar */
.menuRow,.menuCard{background:linear-gradient(160deg,rgba(168,85,247,.10),rgba(34,211,238,.06)),var(--card);border:1.5px solid color-mix(in srgb,var(--p) 40%,var(--bd));border-radius:clamp(16px,4.5vw,22px);position:relative;overflow:hidden;box-shadow:none}
.menuRow::before,.menuCard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--p),var(--s))}
.menuRow{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:14px 18px 14px 20px;font-size:clamp(16px,4.6vw,18px);font-weight:800;color:var(--tx);text-align:left}
.menuCard .entriesHead{min-height:56px;padding-left:calc(20px - clamp(14px,4vw,22px))}
body.light .entry .acts .ghost{color:#2563eb}
.seg button{min-height:42px}
.item{min-height:52px}
.nav{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav button{font-size:12px;min-height:54px}
.toast{font-size:14px}
input,select,textarea{min-height:46px}
body.light{--bg:#eef1f8}
body.light .top{background:#ffffff}
body.light .nav{background:#ffffff}
body.light input,body.light select,body.light textarea{background:#f7f8fc}
@media (max-width:380px){
  body{font-size:14.5px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}
  .kpi small{font-size:11.5px}
  .hero{padding:15px}
  .card{padding:13px;border-radius:16px}
  .entry{gap:10px}
  .thumb{width:50px;height:50px}
}
/* ===== design pass ===== */
body{font-variant-numeric:tabular-nums}
.card,.kpi,.hero{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--bd);color:var(--sub);padding:8px 14px;border-radius:999px;font-size:13px;min-height:36px}
.chip.on{background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12;border-color:transparent}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#0a0a12;font-size:13px;flex-shrink:0}
.noslip{display:flex;align-items:center;justify-content:center;color:var(--bad);font-weight:900;font-size:20px;border:1px dashed rgba(248,113,113,.6);background:rgba(248,113,113,.08)}
.empty::before{content:'📭';display:block;font-size:28px;margin-bottom:6px}
.dot{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#2a0606;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.nav button{position:relative}
.kpi{background:linear-gradient(180deg,var(--card),var(--card2))}
body.light .hero{background:linear-gradient(135deg,rgba(168,85,247,.10),rgba(34,211,238,.08))}
body.light .track,body.light .thumb{background:#eef0f7}
body.light .kpi{background:#fff}
/* ===== style pass ===== */
body::before{content:'';position:fixed;inset:0 0 auto 0;height:340px;background:radial-gradient(60% 100% at 50% 0%,rgba(168,85,247,.20),transparent 70%);pointer-events:none;z-index:-1}
body.light::before{background:radial-gradient(60% 100% at 50% 0%,rgba(168,85,247,.10),transparent 70%)}
.top{background:rgba(21,21,42,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.light .top{background:rgba(255,255,255,.78)}
.card{border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.25)}
body.light .card{box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,20,40,.06),0 8px 22px rgba(20,20,40,.06)}
.hero{border-radius:18px;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--p),var(--s)) border-box;box-shadow:0 10px 30px rgba(168,85,247,.12)}
body.light .hero{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--p),var(--s)) border-box}
.kpi{border-radius:18px;padding:15px}
.kpi small{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.1px}
.kpi b{font-size:clamp(18px,5vw,22px);font-weight:900;letter-spacing:-.3px}
.hero .big{font-size:clamp(26px,8vw,34px);font-weight:900;letter-spacing:-.5px}
input,select,textarea{border-radius:14px}
button{border-radius:14px}
.chip{border-radius:999px}
.ic{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px;opacity:.8}
.sheet{border-radius:22px}
.thumb{border-radius:14px}
/* menu stays at the very top, under the app name */
.stickyTop{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.top{position:relative;border-bottom:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}
.nav{position:relative;left:auto;right:auto;bottom:auto;border-radius:0;border:0;border-top:1px solid var(--bd);box-shadow:none;padding:4px 8px 6px;background:transparent}
.nav button{min-height:50px;padding:4px 0}
.nav svg{width:20px;height:20px}
.toast{bottom:calc(28px + env(safe-area-inset-bottom,0px))!important}
/* ---- design pass ---- */
button{min-height:44px;transition:transform .12s ease,opacity .12s ease}
button:active{transform:scale(.97);opacity:.9}
body.light .card{border-color:#dfe3ee}
.thumb{border:2px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.nav button.on::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:3px;background:var(--s)}
.toast.show{border-color:var(--ok)}
.badge.b-ok::before{content:'✓ '}
.badge.b-warn::before{content:'! '}
.badge.b-sub::before{content:'… '}
.badge.b-bad::before{content:'✕ '}
.badge.b-s::before,.badge.b-p::before{content:''}
.badge{background:none;padding:0;border-radius:0;font-size:12.5px;font-weight:800;color:var(--sub)}
.badge.b-ok{color:var(--ok)}.badge.b-bad{color:var(--bad)}.badge.b-s{color:var(--s)}.badge.b-p{color:var(--p)}.badge.b-sub{color:var(--blue)}.badge.b-warn{color:var(--warn)}
body.light .badge.b-s{color:#0e7490}body.light .badge.b-p{color:#7e22ce}body.light .badge.b-sub{color:#1d4ed8}body.light .badge.b-warn{color:#b45309}
/* ---- member rows (admin home) ---- */
.mrow{padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:active{opacity:.85}
.grow{min-width:0}
input[type=date]{min-width:0;width:100%;-webkit-appearance:none;appearance:none}
details.sec{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin:12px 0;padding:14px 16px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;color:var(--mut,inherit)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'›';font-size:22px;opacity:.6;transition:transform .2s;transform:rotate(90deg)}

details.sec.danger>summary{color:var(--bad)}
details.sec .secBody{margin-top:12px}
#imgBox{z-index:2147483640;padding:0;background:rgba(0,0,0,.92)}
/* pay-slip viewer and confirm box must sit above the member popup */

#imgBox .viewBar .ghost{background:rgba(255,255,255,.18);color:#fff;min-width:48px;min-height:48px;border-radius:50%;font-size:20px;font-weight:900;padding:0 12px}
#vBack{font-size:0}
#vBack::before{content:'✕';font-size:22px;font-weight:900}
#imgBig{max-width:100vw;max-height:86vh;width:auto;height:auto;object-fit:contain;border-radius:0;touch-action:pinch-zoom}
#fMsg.err{color:#e5484d;font-weight:700}
#memberList .mhead{display:flex;align-items:center;gap:12px}
.mav{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.mname{font-weight:800;font-size:16px}
.mchip{font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap;flex:none}
.mchip.g{background:#e2f7ef;color:#1b8a64}
.mchip.r{background:#fde7e7;color:#c24141}
.mbar{height:8px;background:var(--bd);border-radius:8px;margin:12px 0 6px;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--s));border-radius:8px}
.gh{font-size:12px;color:var(--sub);font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:22px 6px 10px}
/* member popup: close button stays small, popup never goes past the top of the screen */
#memBox{padding:24px 16px}
#memBox .sheet{max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px)!important}
#memBox .sheet > .row.between{position:sticky;top:-16px;z-index:3;background:var(--card);padding:6px 0 10px;margin-top:-16px}
#memBox .row.between > button{flex:none;min-height:40px;padding:0 14px;white-space:nowrap}
/* member cards in the control panel: chip wraps under the name on narrow screens */
#memberList .mhead{flex-wrap:wrap}
#memberList .mhead .grow{flex:1 1 150px}
#memberList .mhead .mchip{margin-left:auto}
/* new-entry popup */
#entryBox{padding:12px 16px;align-items:flex-start}
#entryBox .sheet{width:100%;max-width:520px;max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;padding:16px;margin:0 auto}
#entryBody > .card{margin:0;box-shadow:none;border:0;padding:0;background:transparent}
#entryBody > .card h3{display:none}
#entryBox .entryClose{flex:0 0 42px;width:42px;min-width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;font-size:18px;font-weight:800;line-height:1}
@media (max-width:600px){
  #entryBox{padding:0;align-items:flex-start}
  #entryBox .sheet{max-width:100%;border-radius:0 0 22px 22px;max-height:calc(100dvh - 0px);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
}
/* notes popup */
#notesBox{padding:24px 16px}
#notesBox .sheet{width:100%;max-width:520px;max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;padding:16px}
#entryBody > .card{margin:0;box-shadow:none;border:0;padding:0;background:transparent}
#entryBody > .card h3{display:none}
#notesBox .entryClose{flex:0 0 42px;width:42px;min-width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;font-size:18px;font-weight:800;line-height:1}
@media (max-width:600px){
  #notesBox{padding:0;align-items:flex-end}
  #notesBox .sheet{max-width:100%;border-radius:22px 22px 0 0;max-height:calc(100dvh - 24px);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
}
#notesBody > .card{margin:0;box-shadow:none;border:0;padding:0;background:transparent}
#notesBody > .card > h3{display:none}
@keyframes noteUp{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
#notesBox{align-items:center}
#notesBox .sheet{animation:noteUp .2s ease-out;max-height:calc(100dvh - 48px);border-radius:22px}
@media (max-width:600px){
  #notesBox{padding:16px;align-items:center}
  #notesBox .sheet{max-width:100%;border-radius:22px;max-height:calc(100dvh - 32px);padding:16px}
}
.noteItem{margin:0;padding:12px 0;border-top:1px solid var(--bd)}
.noteItem .noteBy{font-weight:800;font-size:16px}
.noteItem .noteWhen{font-size:12.5px;opacity:.7}
.noteItem .noteTxt{margin-top:6px;white-space:pre-wrap;font-size:19px;line-height:1.6;font-weight:600}
.noteItem .noteDel{margin-top:8px;min-height:32px;font-size:12.5px}
/* info popup (ⓘ) */
#infoBox{padding:24px 16px}
#infoBox .sheet{width:100%;max-width:520px;max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;padding:16px}
#entryBody > .card{margin:0;box-shadow:none;border:0;padding:0;background:transparent}
#entryBody > .card h3{display:none}
#infoBox .entryClose{flex:0 0 42px;width:42px;min-width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;font-size:18px;font-weight:800;line-height:1}
@media (max-width:600px){
  #infoBox{padding:0;align-items:flex-end}
  #infoBox .sheet{max-width:100%;border-radius:22px 22px 0 0;max-height:calc(100dvh - 24px);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
}
/* member popup on phones: bottom sheet, full width, name takes its own row */
@media (max-width:600px){
  #memBox{padding:0;align-items:flex-end}
  #memBox .sheet{max-width:100%;border-radius:22px 22px 0 0;max-height:calc(100dvh - 24px)!important;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
  #memBox .mgrid{grid-template-columns:1fr 1fr}

}
/* ⓘ info popups: centred box with a border on every screen size */
#infoBox{padding:16px;align-items:center;justify-content:center}
#infoBox .sheet{width:100%;max-width:480px;max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;border:2px solid var(--p);border-radius:16px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
@media (max-width:600px){
  #infoBox{padding:16px;align-items:center}
  #infoBox .sheet{max-width:100%;border-radius:16px;max-height:calc(100dvh - 32px);padding:16px 16px}
}
/* total mess bazar tile inside the breakdown card */
.totalGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 10px}
.totalGrid .totalTile{margin:0;min-width:0;text-align:center}
.totalTile{border-radius:16px;padding:14px 16px;margin:2px 0 10px;background:linear-gradient(135deg,rgba(168,85,247,.16),rgba(34,211,238,.10));border:1px solid var(--bd)}
.totalTile .totalAmt{font-size:clamp(19px,5.6vw,26px);font-weight:900;letter-spacing:-.4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:clip}
/* ===== home page look: livelier cards, bigger readable text, fits any screen ===== */
#hContent > .card{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--bd);transition:transform .2s ease,box-shadow .2s ease}
#hContent > .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--p),var(--s));border-radius:0 4px 4px 0}
#hContent > .card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(168,85,247,.18)}
#hContent > .card:nth-child(2){animation-delay:.05s}
#hContent > .card:nth-child(3){animation-delay:.1s}
#hContent > .card:nth-child(4){animation-delay:.15s}
#hContent > .card:nth-child(n+5){animation-delay:.2s}
#hContent > .card h3{font-size:clamp(15px,4.2vw,17px);font-weight:800;color:var(--tx);letter-spacing:0;margin-bottom:14px;padding-left:4px}
#hContent .card .sub{font-size:clamp(13px,3.7vw,14.5px);line-height:1.5}
#hContent .card > div:not(.sub){font-size:clamp(15px,4vw,16.5px)}
#hContent .card b{font-weight:800}
#hContent .totalGrid{gap:8px}
#hContent .totalTile{border-radius:18px;padding:16px 14px;background:linear-gradient(135deg,rgba(168,85,247,.20),rgba(34,211,238,.12));border:1px solid rgba(168,85,247,.25)}
#hContent .totalTile .sub{font-size:clamp(13px,3.6vw,14px);font-weight:600}
#hContent .totalTile .totalAmt{font-size:clamp(20px,6.2vw,28px);font-weight:900;margin-top:6px;letter-spacing:-.3px}
#hContent .totalTile:last-child{background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(168,85,247,.10))}
#hContent .totalGrid.tri{grid-template-columns:repeat(3,1fr);gap:8px}
#hContent .totalGrid.tri .totalTile{padding:10px 6px;border-radius:14px}
#hContent .totalGrid.tri .totalTile .sub{font-size:11.5px;line-height:1.25}
#hContent .totalGrid.tri .totalTile .totalAmt{font-size:clamp(14px,4.3vw,19px);margin-top:4px}
#hContent .row.between{padding:10px 2px !important;border-bottom:1px dashed var(--bd)}
#hContent .row.between:last-child{border-bottom:0}
#hContent .row.between span{font-size:clamp(14.5px,3.9vw,16px)}
#hContent .row.between b{font-size:clamp(15px,4vw,17px)}
/* "আমার হিসাব" (all members) card: bigger names and figures */
#balCard b{font-size:clamp(17px,5vw,19px)}
#balCard .sub{font-size:clamp(14.5px,4.1vw,16px)}
#balCard .balTag, #balCard .badge{font-size:clamp(14px,4vw,15.5px);padding:6px 12px}
#balCard .chip{font-size:clamp(15px,4.2vw,16.5px)}
#balCard h3{font-size:clamp(18px,5.2vw,20px)}
@media (max-width:360px){
  #hContent .totalGrid{grid-template-columns:1fr}
  #hContent .totalTile{padding:14px}
}
@media (prefers-reduced-motion:reduce){ #hContent > .card{transition:none} #hContent > .card:hover{transform:none} }

/* ===== whole app: fill the screen width, one accent colour, text scales with the screen ===== */
.wrap{max-width:none;width:100%;padding:clamp(10px,3vw,20px) clamp(12px,4vw,24px) 0}
body{font-size:clamp(15px,4vw,17px);line-height:1.5}
.card{border:1.5px solid color-mix(in srgb,var(--p) 35%,var(--bd));border-radius:clamp(16px,4.5vw,22px);padding:clamp(14px,4vw,22px);margin-bottom:clamp(12px,3.5vw,16px)}
.card h3{font-size:clamp(16px,4.6vw,19px)}
.sub{font-size:clamp(13.5px,3.8vw,15.5px)}
.card b,.card .num{font-size:inherit}
input,textarea,select{font-size:clamp(16px,4.2vw,17px)}
button{min-height:46px}
.chip{min-height:44px}
#pgEntries .thumb{width:46px;height:46px;border-radius:12px}
#pgEntries .entry{padding:10px 0;gap:10px}
.nav{background:linear-gradient(180deg,var(--card),var(--card2));border-top:1.5px solid color-mix(in srgb,var(--p) 35%,var(--bd))}
.nav button{font-size:clamp(11.5px,3.3vw,13px);font-weight:700;min-height:48px;gap:2px;padding:2px 0}
.nav button.on{color:var(--p)}
.nav button.on svg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--s) 60%,transparent))}
.nav svg{width:clamp(18px,5vw,22px);height:clamp(18px,5vw,22px)}
.top{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:8px}
#app > .top .brand, .brand{font-size:clamp(16px,4.6vw,20px)}
.sheet{border:1.5px solid color-mix(in srgb,var(--p) 40%,var(--bd));border-radius:clamp(18px,5vw,24px)}
@media (min-width:900px){ .wrap{padding-left:clamp(24px,3vw,48px);padding-right:clamp(24px,3vw,48px)} }

/* ===== control panel + settings: coloured boxes ===== */
details.sec{background:linear-gradient(160deg,rgba(168,85,247,.10),rgba(34,211,238,.06)),var(--card);border:1.5px solid color-mix(in srgb,var(--p) 40%,var(--bd));border-radius:clamp(16px,4.5vw,22px);position:relative;overflow:hidden}
details.sec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--p),var(--s))}
details.sec>summary{font-size:clamp(16px,4.6vw,18px);font-weight:800;padding:2px 0 2px 6px}
details.sec[open]{background:linear-gradient(160deg,rgba(168,85,247,.16),rgba(34,211,238,.10)),var(--card)}
details.sec.danger{background:linear-gradient(160deg,rgba(248,113,113,.14),rgba(251,191,36,.06)),var(--card)}
details.sec.danger::before{background:linear-gradient(180deg,var(--bad),var(--warn))}
details.sec .secBody{padding-left:6px}
details.sec .secBody .item{border-top:0;margin:8px 0;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(168,85,247,.14),rgba(34,211,238,.08));border:1px solid color-mix(in srgb,var(--p) 30%,var(--bd));font-size:clamp(15px,4.2vw,16.5px)}
details.sec .secBody .item:active{transform:scale(.99)}
details.sec .secBody .item .sub{color:var(--s)}
details.sec .secBody .lbl{color:var(--p);font-size:clamp(13.5px,3.8vw,15px);font-weight:800;margin-top:14px}
details.sec .secBody .seg button{min-height:42px}

/* ===== extra colour themes (ocean, forest, sunset, rose, mint) ===== */
body.th-ocean{--bg:#071827;--card:#0d2538;--card2:#123049;--tx:#eaf6ff;--sub:#8fb3c9;--bd:#1d4262;--inp:#0a1f30;--p:#38bdf8;--s:#2dd4bf}
body.th-forest{--bg:#07140e;--card:#0f2318;--card2:#163424;--tx:#ecfdf3;--sub:#97bfa8;--bd:#22503a;--inp:#0a1c12;--p:#34d399;--s:#a3e635}
body.th-sunset{--bg:#1a0b10;--card:#261218;--card2:#33181f;--tx:#fff1ec;--sub:#d6a59a;--bd:#55262f;--inp:#1f0d13;--p:#fb923c;--s:#f43f5e}
body.th-rose{--bg:#140816;--card:#201025;--card2:#2b1634;--tx:#fdf2fb;--sub:#c9a3c4;--bd:#4a2350;--inp:#1a0c1f;--p:#e879f9;--s:#fb7185}
body.th-mint{--bg:#eefaf5;--card:#ffffff;--card2:#f3fbf7;--tx:#0f2a20;--sub:#4d6f62;--bd:#cfe9de;--inp:#f4fbf8;--p:#10b981;--s:#06b6d4}
body.th-mint .nav,body.th-mint .top{background:#ffffff}
body.th-realmadrid{--bg:#f4f6fb;--card:#ffffff;--card2:#eef2fa;--tx:#0b1a33;--sub:#4b5a78;--bd:#d5dcea;--inp:#f7f9fd;--p:#1e3a8a;--s:#c9a227}
body.th-bangladesh{--bg:#f2fbf6;--card:#ffffff;--card2:#e8f6ee;--tx:#0d2a1f;--sub:#4a6b5c;--bd:#cfe6d9;--inp:#f7fcf9;--p:#006a4e;--s:#f42a41}
body.th-france{--bg:#0a1230;--card:#141d45;--card2:#1c2759;--tx:#f5f7ff;--sub:#b4bcdc;--bd:#2a3670;--inp:#0e1638;--p:#ed2939;--s:#3b6fd8}
body.th-barcelona{--bg:#0b0f2e;--card:#151a40;--card2:#1d2352;--tx:#fdf6e3;--sub:#b9b5d6;--bd:#2c3370;--inp:#0f1438;--p:#a50044;--s:#004d98}
body.th-ocean::before,body.th-forest::before,body.th-sunset::before,body.th-rose::before,body.th-realmadrid::before,body.th-barcelona::before,body.th-bangladesh::before,body.th-france::before{background:radial-gradient(60% 100% at 50% 0%,color-mix(in srgb,var(--p) 14%,transparent),transparent 70%)}

/* ---- login page ---- */
.login{min-height:100vh;min-height:100dvh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--p) 30%,transparent),transparent 60%),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--p2,#4fc3e8) 26%,transparent),transparent 60%)}
.login .card{max-width:min(440px,100%);width:100%;padding:clamp(20px,4vw,30px);border-radius:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);animation:none;opacity:1}
.login,.login *{animation:none!important;transition:none!important}
.loginHero{text-align:center;margin-bottom:22px}
.avRing{width:clamp(92px,26vw,116px);height:clamp(92px,26vw,116px);margin:0 auto 14px;padding:4px;border-radius:50%;background:linear-gradient(135deg,#7c5cf5,#4fc3e8,#ec4899);box-shadow:0 12px 30px rgba(124,92,245,.4)}
.avRing img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 30%;display:block;background:var(--card,#1a1a2e)}
.loginBrand{font-size:clamp(20px,5.6vw,24px);font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,#7c5cf5,#4fc3e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.loginHero .sub{margin-top:6px;font-size:clamp(13px,3.6vw,14px)}
.byline{font-size:13px;font-style:italic;color:var(--sub);margin-top:10px;opacity:.85}
.login input{font-size:16px}
@media (max-height:620px){.loginHero{margin-bottom:12px}.avRing{width:72px;height:72px;margin-bottom:8px}}

/* ---- member home: "আমার হিসাব" and "সব সদস্য" cards bigger ---- */
#balCard,#allCard{padding:clamp(18px,5vw,24px)}
#balCard h3,#allCard h3{font-size:clamp(20px,5.6vw,24px)}
#balCard .row.between,#allCard .row.between{padding:14px 0 !important}
#balCard b,#allCard b{font-size:clamp(17px,4.8vw,19px)}
#balCard .sub,#allCard .sub{font-size:clamp(13px,3.8vw,15px)}
#balCard .num,#allCard .num{font-size:clamp(15px,4.4vw,17px)}
#balCard .badge,#balCard .mchip,#allCard .badge,#allCard .mchip{font-size:clamp(12px,3.4vw,14px);padding:5px 12px}
#balCard .ghost,#allCard .ghost{font-size:14px;min-height:36px}
/* ---- control panel: compact member cards ---- */
.mcompact{padding:12px 14px}
.mcompact .mchip{font-size:11px;white-space:nowrap;padding:3px 8px}
/* ---- admin member popup: compact entry rows ---- */
.miniRow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd);align-items:flex-start}
.miniThumb{width:44px;height:44px;flex-shrink:0;border-radius:10px;object-fit:cover}
.slipIcon{display:grid;place-items:center;font-size:20px;border:1px solid var(--bd);background:var(--card2);cursor:pointer;padding:0}
.miniInfo{flex:1;min-width:0}
.miniRow .acts{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.miniRow .acts button{min-height:30px;padding:4px 10px;font-size:12px}
/* ---- placeholder: faded, clearly a hint not a value ---- */
input::placeholder,textarea::placeholder{color:var(--sub);opacity:.45}

/* ---- admin tab bar: 3 equal columns, same height, no broken wrapping ---- */
.admTabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.admTabs .admTab{font-size:12.5px;padding:8px 4px;min-height:44px}
#entriesHost .card{animation:none;opacity:1}
#pgAdmin .card,#hContent .card{animation:none;opacity:1}   /* control panel and Home cards stay visible on every redraw */   /* moving the Entries cards restarts their fade-in; keep them visible */
.admTab{min-height:56px;padding:8px 6px;font-size:clamp(13px,3.7vw,15px);font-weight:800;line-height:1.25;white-space:normal;text-align:center;display:flex;align-items:center;justify-content:center;border-radius:16px;word-break:keep-all;overflow-wrap:anywhere}
.admTab.pri{box-shadow:0 8px 20px -10px var(--p)}
/* admin tab bar: one rounded segmented control, active tab filled */
.admTabs{gap:4px;padding:4px;background:var(--card2);border:1px solid var(--bd);border-radius:20px;margin-bottom:14px}
.admTabs .admTab{border:0;background:transparent;box-shadow:none;border-radius:16px;min-height:46px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--sub)}
.admTabs .admTab.pri{color:#0a0a12;background:linear-gradient(135deg,var(--p),var(--s));box-shadow:0 6px 16px -8px var(--p)}
body.light .admTabs .admTab.pri{color:#fff;background:linear-gradient(135deg,#7c3aed,#0891b2)}
/* settings option rows (language, font size): one row per choice, ticked when chosen */
.optList{display:grid;gap:8px;margin-top:8px}
.optRow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:12px 16px;border-radius:16px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:15px;font-weight:700;text-align:left}
.optRow.on{box-shadow:inset 4px 0 0 var(--p);border-color:var(--p)}
.optTick{color:var(--ok);font-weight:900;font-size:17px}

/* ---- settings: account card ---- */
.meCard{background:linear-gradient(135deg,color-mix(in srgb,var(--p) 22%,var(--card)),color-mix(in srgb,var(--s,var(--p)) 12%,var(--card)));border:1px solid color-mix(in srgb,var(--p) 45%,var(--bd));padding:clamp(16px,4vw,20px)}
.meTop{display:flex;align-items:center;gap:clamp(10px,3vw,16px);flex-wrap:wrap}
.meAv{width:clamp(56px,15vw,64px);height:clamp(56px,15vw,64px);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(22px,6vw,26px);color:#0a0a12;background:linear-gradient(135deg,var(--p),var(--s,var(--p)));box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 35%,transparent),0 10px 24px -8px var(--p)}
.meInfo{flex:1 1 180px;min-width:0}
.meName{font-size:clamp(17px,4.6vw,20px);font-weight:800;letter-spacing:.2px;overflow-wrap:anywhere}
.meMail{font-size:clamp(13px,3.6vw,14px);color:var(--sub);margin-top:3px;overflow-wrap:anywhere}
.meRole{font-size:13px;font-weight:800;padding:6px 14px;border-radius:999px;white-space:nowrap}
.meOut{width:100%;margin-top:14px;padding:12px;border-radius:14px;font-size:clamp(15px,4vw,16px);font-weight:800;color:var(--bad,#ff6b6b);background:color-mix(in srgb,var(--bad,#ff6b6b) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad,#ff6b6b) 40%,transparent);cursor:pointer}
.meOut:active{transform:scale(.98)}
.pwWrap{position:relative}.pwWrap input{width:100%;padding-right:46px}.eyeBtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:18px;cursor:pointer;padding:4px;min-height:0}
.superChips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.superChips button{min-height:36px;padding:6px 12px;font-size:13px}
.superMini{display:inline-flex;align-items:center;border-radius:10px;overflow:hidden;border:1px solid rgba(128,128,128,.35)}.superMini button{border:0;border-radius:0;padding:7px 9px;background:transparent}.superMini.on{background:rgba(124,92,255,.18)}.superTabs,.superChips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.superTabs button,.superChips button{flex:1 1 auto;padding:8px 10px}
/* member home: hero balance card */
.hHero{border-radius:18px;padding:18px;margin:0 0 12px;text-align:center;border:1px solid var(--bd);background:var(--card2)}
.hHero.pos{background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(34,211,238,.10));border-color:rgba(34,197,94,.35)}
.hHero.neg{background:linear-gradient(135deg,rgba(248,113,113,.18),rgba(168,85,247,.08));border-color:rgba(248,113,113,.35)}
.hHeroLbl{font-size:14px;font-weight:700;color:var(--sub)}
.hHeroAmt{font-size:34px;font-weight:900;margin:4px 0 2px;letter-spacing:-.5px}
/* member home: tighter boxes so the page takes less height (text sizes stay the same) */
#hContent.memberHome .card{padding:12px 14px;margin-bottom:10px}
#hContent.memberHome .hCard h3{margin:0 0 6px}
#hContent.memberHome .hHero{padding:14px 10px;margin:0 0 10px}
#hContent.memberHome .hHeroAmt{font-size:30px;margin:2px 0 0}
#hContent.memberHome .totalGrid{gap:8px;margin:0 0 8px}
#hContent.memberHome .totalTile{padding:8px 10px;margin:0}
#hContent.memberHome .totalTile .totalAmt{font-size:clamp(16px,4.6vw,20px)}
#hContent.memberHome button[onclick="memberGallery(me)"]{padding:10px 12px !important;margin-bottom:10px !important}
#hContent.memberHome #balCard{padding:10px}
#hContent.memberHome details.sec summary{padding:6px 0}
.card .hHeroAmt{font-size:34px;font-weight:900}
.hHero.pos .hHeroAmt{color:var(--pos)}.hHero.neg .hHeroAmt{color:var(--bad)}
.hHeroSub{font-size:12.5px;color:var(--sub)}
.hCard{box-shadow:none}
/* super admin: modern layout */
.sHero{background:linear-gradient(135deg,rgba(168,85,247,.28),rgba(34,211,238,.14)),var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin:4px 0 12px}
body.light .sHero{background:linear-gradient(135deg,rgba(168,85,247,.13),rgba(34,211,238,.09)),var(--card)}
.sHeroT{font-size:20px;font-weight:800;letter-spacing:-.2px;margin-top:2px}
.sKpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
@media (min-width:600px){.sKpis{grid-template-columns:repeat(4,1fr)}}
.sKpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;min-width:0}
.sKpi b{display:block;font-size:19px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sKpi b.g{color:var(--ok)}.sKpi b.red{color:var(--bad)}
.sSeg{display:flex;gap:4px;background:var(--inp);border:1px solid var(--bd);border-radius:14px;padding:4px;overflow-x:auto;margin:4px 0 12px;scrollbar-width:none}
.sSeg button{flex:1 1 0;min-width:0;background:transparent;padding:9px 4px;border-radius:10px;font-size:12.5px;color:var(--sub);white-space:nowrap;margin:0}
.sSeg button.on{background:var(--card2);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sSearch input{margin:0;border-radius:14px;padding:13px 14px}
.sChips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;scrollbar-width:none;padding-bottom:2px}
.sChips button{flex:none;border-radius:999px;padding:7px 14px;font-size:13px;min-height:34px;background:var(--card);border:1px solid var(--bd);color:var(--sub);margin:0}
.sChips button.on{background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12;border-color:transparent}
.sList{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;margin-top:8px}
.sRow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:transparent;border:0;border-radius:0;border-top:1px solid var(--bd);color:var(--tx);text-align:left;font-weight:500;margin:0;min-height:0}
.sList .sRow:first-child{border-top:0}
.sRow:active{background:var(--card2)}
.sRowMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sRowMain b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sRowMain .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sRowSide{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.sRowSide .sub{font-size:11.5px}
.sAv{flex:none;width:40px;height:40px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#0a0a12;background:linear-gradient(135deg,var(--p),var(--s))}
.sAv.warn{background:var(--warn)}.sAv.off{background:var(--bd);color:var(--sub)}
.sTag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(248,113,113,.16);color:var(--bad)}
.sBack{padding:8px 14px;font-size:13px;border-radius:999px;margin:0 0 10px;min-height:0}
.sDetTop{display:flex;gap:12px;align-items:center}
.sCard{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;margin-bottom:12px}
details.sCard>summary{cursor:pointer;list-style:none}
details.sCard>summary::-webkit-details-marker{display:none}
.sGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sGrid button{min-height:44px;font-size:13.5px;border-radius:12px;margin:0}
.sGrid .wide{grid-column:1/-1}
.sGroup{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.3px;margin:14px 0 0;text-transform:uppercase}
/* super admin design pass: tidier tabs, cards, headings and buttons */
.sHero{padding:16px;border-radius:20px;margin:2px 0 12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sHeroT{font-size:19px;line-height:1.25}
.sKpis{gap:8px;margin-top:12px}
.sKpi{padding:12px;border-radius:14px}
@media (max-width:599px){.sKpis .sKpi:last-child:nth-child(odd){grid-column:1/-1}}
.sKpi .sub{font-size:12px;line-height:1.3}
.sKpi b{font-size:20px;font-weight:800;margin-top:4px}
.sSeg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px;border-radius:16px;overflow:visible;margin:2px 0 14px}
.sSeg button{min-height:46px;padding:6px 2px;font-size:12px;font-weight:700;line-height:1.2;white-space:normal;text-align:center;display:flex;align-items:center;justify-content:center;border-radius:12px}
.sSeg button.on{background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12;box-shadow:0 4px 12px rgba(168,85,247,.35)}
.sList{border-radius:18px;margin-top:6px}
.sRow{padding:12px 14px;gap:12px}
.sRowMain b{font-size:15px;font-weight:700}
.sAv{width:42px;height:42px;border-radius:14px}
.sCard{border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
details.sCard>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;min-height:30px}
details.sCard>summary::after{content:'›';font-size:24px;line-height:1;color:var(--sub);transition:transform .2s ease;flex:none}
details.sCard[open]>summary::after{transform:rotate(90deg)}
.sGrid{gap:8px}
.sGrid button{min-height:46px;font-size:14px;font-weight:700}
.sGroup{margin:16px 0 0;font-size:11.5px;letter-spacing:.04em;color:var(--bad)}
.sDetTop{gap:14px}
.sStick{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0 10px;margin:0}
.sStick .sBack{margin:0}
.sStick button.ghost:not(.sBack){min-height:36px;padding:6px 12px;font-size:13px;margin:0;margin-left:auto}
.sCodeBox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-top:12px}
.sCode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:3px;margin-top:2px}
.sSortRow{margin-top:6px}
#nmBtn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.sLogRow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.sLogRow>span:first-child{flex:none;min-width:44px}
.sCard .gh:first-child{margin-top:0}
/* design pass: floating add button, positive colour token, page fade-in, small phones */
:root{--pos:#22c55e}
.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;width:58px;height:58px;min-height:0;padding:0;border-radius:50%;font-size:30px;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12;box-shadow:0 10px 26px rgba(168,85,247,.45)}
.fab:active{transform:scale(.94)}
.fab.hidden{display:none!important}
.fab{transition:opacity .2s ease,transform .2s ease}
.fab.scrollHide{opacity:0;transform:translateY(14px);pointer-events:none}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#hContent.pop{animation:pageIn .35s ease both}
@media (max-width:380px){#hContent .totalTile .totalAmt{font-size:clamp(13px,4vw,17px)} #hContent .row b.num{font-size:.92em}}

/* In-app sheet: replaces prompt() and confirm() */
function sheet({ title, input = true, value = '', type = 'text', ph = '', okText, raw = false }) {
  return new Promise(resolve => {
    $('shTitle').innerText = title;
    const i = $('shIn');
    i.classList.toggle('hidden', !input);
    i.type = type; i.value = value; i.placeholder = ph;
    $('shCancel').innerText = t('cancel');
    $('shOk').innerText = okText || t('ok');
    $('sheet').classList.remove('hidden');
    openLayer('sheet');
    if (input) setTimeout(() => i.focus(), 50);
    const done = v => {
      dropLayer('sheet');
      $('sheet').classList.add('hidden');
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // closes the iPhone keyboard
      $('shOk').onclick = null; $('shCancel').onclick = null; i.onkeydown = null;
      resolve(v);
    };
    const val = () => (raw ? i.value : i.value.trim());
    $('shOk').onclick = () => done(input ? val() : true);
    $('shCancel').onclick = () => done(input ? null : false);
    i.onkeydown = e => { if (e.key === 'Enter') done(val()); };
  });
}

  const em = allEmails();

}

/* show / hide a password field */
function togglePw(btn) {
  const i = btn.parentElement.querySelector('input');
  i.type = i.type === 'password' ? 'text' : 'password';
  btn.textContent = i.type === 'password' ? '👁' : '🙈';

async function signup() {
  const e = $('lEmail').value.trim().toLowerCase(), p = $('lPass').value, p2 = $('sPass2').value;
  const nm = $('sName').value.trim();
  const bn = lang === 'bn', msg = m => { $('lMsg').style.color = 'var(--bad)'; $('lMsg').innerText = m; };
  if (!e) return msg(bn ? 'ইমেইল দাও' : 'Enter your email');
  if (p.length < 6) return msg(bn ? 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর' : 'Password must be at least 6 characters');
  if (p !== p2) return msg(bn ? 'দুটো পাসওয়ার্ড মিলছে না' : 'Passwords do not match');
  if (!nm) return msg(bn ? 'পুরো নাম লেখো' : 'Enter your full name');
  try {
    const cred = await auth.createUserWithEmailAndPassword(e, p);
    try { localStorage.setItem('mh_signup_name', nm); } catch (x) {}   // used when the request is sent after verification
    // a valid mess invite code from the admin: join that mess now, no email verification needed
    const sc = (($('sCode') && $('sCode').value) || '').trim().toUpperCase();
    if (sc) {
      try {
        const c = await db.collection('codes').doc(sc).get();
        if (c.exists) {
          const mid = c.data().messId;
          await db.collection('users').doc(e).set({ messId: mid, name: nm, code: sc });
          await db.collection('messes').doc(mid).collection('members').doc(e)
            .set({ email: e, name: nm, days: 30, deposit: 0, joined: new Date().toISOString().slice(0, 7) });
          toast(bn ? 'যোগ দেওয়া হয়েছে' : 'You have joined');
          setTimeout(() => location.reload(), 600);
          return;
        }
      } catch (x) { /* code not usable: continue with the normal verification flow */ }
    }
    await cred.user.sendEmailVerification();
  } catch (err) {
    msg(bn ? 'অ্যাকাউন্ট খোলা গেলো না (ইমেইল আগে থেকেই থাকতে পারে)' : 'Could not create the account (the email may already exist)');
  }
}

}

const APP_VERSION = 'v2.0.0 (multi-mess) · 2026-10-31';   // bump on every upload

async function loadAllMesses() {
  if (me !== SUPER_EMAIL) return;
  try {
    const snap = await db.collection('messes').get();
    const out = [];
    for (const d of snap.docs) {
      const m = d.data();
      const [mem, sum, mon] = await Promise.all([d.ref.collection('members').get(), d.ref.collection('summary').doc('main').get(), d.ref.collection('monthly').get()]);
      // all months: every closed month's saved total + the current month's total
      // the current month comes from the live summary only; an old saved copy of it is ignored
      const thisKey = new Date().toISOString().slice(0, 7);
      const closedDocs = mon.docs.filter(x => x.id !== thisKey);
      const closedTot = closedDocs.reduce((a, x) => a + Number((x.data() || {}).total || 0), 0);
      const curTot = sum.exists ? Number(sum.data().tB || 0) : 0;
      out.push({ id: d.id, name: m.name || d.id, admin: m.admin || '', code: m.inviteCode || '',
                 active: m.active !== false, archived: m.archived === true, statusNote: m.statusNote || '',
                 adminFrozen: m.adminFrozen === true, adminFreezeNote: m.adminFreezeNote || '',
                 createdAt: m.createdAt || 0, count: mem.size, sub: m.subscription || null, tB: curTot, allTB: closedTot + curTot, closedMonths: closedDocs.length,
                 months: closedDocs.map(x => ({ id: x.id, total: Number((x.data() || {}).total || 0) })).sort((a, b) => (a.id < b.id ? 1 : -1)),
                 memList: mem.docs.map(x => ({ email: x.id, name: x.data().name || x.id, days: x.data().days, deposit: x.data().deposit })) });
    }
    allMesses = out.sort((a, b) => b.createdAt - a.createdAt);
    const logs = await db.collection('superLogs').orderBy('at', 'desc').limit(30).get();
    superLogs = logs.docs.map(x => x.data());
    render();
  } catch (e) { showErr(e); }
}

/* super admin actions on one mess (i = index in allMesses). Nothing here deletes data: a mess is archived, never removed */
async function superAct(i, what) {
  const bn = lang === 'bn';
  const m = (allMesses || [])[i];
  if (!m || me !== SUPER_EMAIL) return;
  const mref = db.collection('messes').doc(m.id);
  const own = m.id === MID;
  try {
    if (what === 'members') {
      if (superOpen.has(m.id)) superOpen.delete(m.id); else superOpen.add(m.id);
      return render();
    }
    if (what === 'toggle') {
      if (own) return toast(bn ? 'নিজের mess বন্ধ করা যাবে না' : 'Cannot switch off your own mess', true);
      const sure = await sheet({ title: m.active ? (bn ? `"${m.name}" বন্ধ করবে?` : `Switch off "${m.name}"?`) : (bn ? `"${m.name}" চালু করবে?` : `Switch on "${m.name}"?`), input: false, okText: m.active ? (bn ? 'বন্ধ করো' : 'Switch off') : (bn ? 'চালু করো' : 'Switch on') });
      if (!sure) return;
      if (m.active) {
        const note = bn ? 'এই mess সাময়িকভাবে বন্ধ করা হয়েছে। বিস্তারিত জানতে super admin এর সাথে যোগাযোগ করো।' : 'This mess has been switched off for now. Contact the super admin for details.';
        await mref.update({ active: false, statusNote: note });
        await logSuper(bn ? 'বন্ধ' : 'switched off', m);
      } else {
        await mref.update({ active: true, statusNote: firebase.firestore.FieldValue.delete() });
        await noteToMess(m.id, bn ? 'এই mess আবার চালু করা হয়েছে' : 'This mess is switched on again');
        await logSuper(bn ? 'চালু' : 'switched on', m);
      }
      toast(t('saved')); return loadAllMesses();
    }
    if (what === 'admin') {
      const v = await sheet({ title: bn ? `"${m.name}" এর নতুন admin এর email` : `New admin email for "${m.name}"`, ph: 'name@gmail.com' });
      const adm = String(v || '').trim().toLowerCase();
      if (!adm.includes('@') || adm === m.admin) return;
      // a person belongs to one mess only: refuse if this email is already in another mess
      const link = await db.collection('users').doc(adm).get();
      if (link.exists && link.data().messId && link.data().messId !== m.id) return toast(bn ? 'এই email অন্য mess এ আছে' : 'This email is in another mess', true);
      await mref.update({ admin: adm });
      await db.collection('users').doc(adm).set({ messId: m.id, name: adm.split('@')[0] }, { merge: true });
      await noteToMess(m.id, (bn ? 'Admin বদলানো হয়েছে: ' : 'Admin changed: ') + m.admin + ' → ' + adm);
      await logSuper(bn ? 'admin বদলানো' : 'admin changed', m, adm);
      toast(t('saved')); return loadAllMesses();
    }

      if (cur.cycle === 'free') { toast(bn ? 'ফ্রি মেসে কোড লাগে না' : 'A free mess needs no code'); return; }
      const cyc = cur.cycle || SUB_DEFAULT_CYCLE;
      const today = isoToday();
      const from = (cur.paidUntil && cur.paidUntil > today) ? cur.paidUntil : today;
      const until = addPeriod(from, cyc);
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');

      const method = String(await sheet({ title: bn ? 'মাধ্যম (PayPal / Wise / bKash / Bank)' : 'Method (PayPal / Wise / bKash / Bank)', value: 'PayPal' }) || '').trim();

      const amount = cur.amount || 0;

      const until = addPeriod(from, cur.cycle);
      await db.collection('messes').doc(m.id).update({

      if (typed !== m.name) return toast(bn ? 'নাম মেলেনি, মোছা হয়নি' : 'Name does not match, nothing deleted', true);
      if (!(await checkSuperPw())) return;

      const reason = String(v || '').trim();
      if (!reason) return;
      await mref.update({ adminFrozen: true, adminFreezeNote: reason.slice(0, 200), adminFreezeAt: Date.now() });
      await noteToMess(m.id, (bn ? 'Admin সাময়িক ফ্রিজ করা হয়েছে। কারণ: ' : 'Admin temporarily frozen. Reason: ') + reason.slice(0, 200));
      await logSuper(bn ? 'admin ফ্রিজ' : 'admin frozen', m, reason.slice(0, 200));
      toast(t('saved')); return loadAllMesses();
    }
    if (what === 'adminUnfreeze') {
      await mref.update({ adminFrozen: false, adminFreezeNote: '' });
      await noteToMess(m.id, bn ? 'Admin এর ফ্রিজ খোলা হয়েছে' : 'Admin freeze lifted');
      await logSuper(bn ? 'admin ফ্রিজ খোলা' : 'admin unfrozen', m);
      toast(t('saved')); return loadAllMesses();

    if (what === 'reset') {

      await mref.update({ name: nm });

      toast(t('saved')); return loadAllMesses();
    }
    if (what === 'archive') {
      if (own) return toast(bn ? 'নিজের mess আর্কাইভ করা যাবে না' : 'Cannot archive your own mess', true);
      const typed = await sheet({ title: bn ? `আর্কাইভ করতে mess এর নাম লেখো: ${m.name}` : `Type the mess name to archive: ${m.name}` });
      if (String(typed || '').trim() !== m.name) return toast(bn ? 'নাম মেলেনি' : 'Name does not match', true);
      const note = bn ? 'এই mess আর্কাইভ করা হয়েছে। ডেটা সংরক্ষিত আছে, কিন্তু এখন ব্যবহার করা যাবে না।' : 'This mess is archived. Its data is kept, but it cannot be used now.';
      await mref.update({ archived: true, active: false, statusNote: note });
      await logSuper(bn ? 'আর্কাইভ' : 'archived', m);
      toast(bn ? 'আর্কাইভ করা হয়েছে' : 'Archived'); return loadAllMesses();

    if (what === 'restore') {
      await mref.update({ archived: false, active: true, statusNote: firebase.firestore.FieldValue.delete() });
      await logSuper(bn ? 'ফিরিয়ে আনা' : 'restored', m);
      toast(t('saved')); return loadAllMesses();
    }

}

/* one-time move of the old single-mess data (root collections) into messes/main. Only the original admin account sees the button */
const LEGACY_ADMIN = 'rafiul.fr@yahoo.com';
const OLD_ADMIN = 'admin@gmail.com';   // old main admin: its rows are moved to the new main admin
async function migrateLegacy() {
  const bn = lang === 'bn';
  if (me !== LEGACY_ADMIN) return;
  const MIDL = 'main', code = 'MAIN' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const chunks = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
  const fixE = e => (e === OLD_ADMIN ? me : e);
  try {
    toast(bn ? 'পুরনো data সরানো হচ্ছে...' : 'Moving old data...');
    const [mem, ent, sli, not, sum, set] = await Promise.all([
      db.collection('members').get(), db.collection('entries').get(), db.collection('slips').get(),
      db.collection('notes').get(), db.collection('summary').doc('main').get(), db.collection('settings').doc('app').get()]);
    const base = db.collection('messes').doc(MIDL);
    await base.set({ name: bn ? 'মেস' : 'Mess', admin: me, inviteCode: code, createdAt: Date.now() });
    await db.collection('codes').doc(code).set({ messId: MIDL });
    await db.collection('users').doc(me).set({ messId: MIDL, name: me.split('@')[0] });
    const memData = d => { const x = { ...d.data() }; if (x.email === OLD_ADMIN) x.email = me; return x; };
    for (const part of chunks(mem.docs, 300)) {
      const b = db.batch();
      part.forEach(d => b.set(base.collection('members').doc(fixE(d.id)), memData(d)));
      await b.commit();
    }
    // members who are not the new admin get their link now, so they can sign in and see this mess
    for (const part of chunks(mem.docs.filter(d => fixE(d.id) !== me), 300)) {
      const b = db.batch();
      part.forEach(d => b.set(db.collection('users').doc(fixE(d.id)), { messId: MIDL, name: d.data().name || d.id.split('@')[0] }));
      await b.commit();
    }
    for (const part of chunks(ent.docs, 300)) {
      const b = db.batch();
      part.forEach(d => { const x = { ...d.data() }; if (x.memberEmail === OLD_ADMIN) x.memberEmail = me; b.set(base.collection('entries').doc(d.id), x); });
      await b.commit();
    }
    for (const part of chunks(not.docs, 300)) {
      const b = db.batch();
      part.forEach(d => { const x = { ...d.data() }; if (x.by === OLD_ADMIN) x.by = me; b.set(base.collection('notes').doc(d.id), x); });
      await b.commit();
    }
    // slips can be large, so small batches
    for (const part of chunks(sli.docs, 20)) {
      const b = db.batch(); part.forEach(d => b.set(base.collection('slips').doc(d.id), d.data())); await b.commit();
    }
    if (sum.exists) await base.collection('summary').doc('main').set(sum.data());
    if (set.exists) await base.collection('settings').doc('app').set(set.data());
    toast(bn ? 'সব data সরানো হয়েছে' : 'Old data moved');
    location.reload();
  } catch (e) { showErr(e); }
}

  // which mess is this person in? users/{email} is written when the mess is created or a join request is approved
  try {
    const link = await getFast(db.collection('users').doc(me));
    if (link.exists && link.data().messId) {
      MID = link.data().messId;
      const ms = await getFast(db.collection('messes').doc(MID));
      MESS_ADMIN = ms.exists ? ms.data().admin : '';
      MESS_FROZEN = ms.exists && ms.data().adminFrozen === true;
      MESS_FREEZE_NOTE = ms.exists ? (ms.data().adminFreezeNote || '') : '';
      MESS_SUB = ms.exists ? (ms.data().subscription || null) : null;
      // switched off or archived: this person sees only the notice page
      const md = ms.exists ? ms.data() : {};
      subExpired = !!(MESS_SUB && (MESS_SUB.paidUntil ? MESS_SUB.paidUntil < isoToday() : MESS_SUB.required === true));
      blocked = ms.exists && (md.active === false || md.archived === true || subExpired);
      blockedNote = blocked ? (md.statusNote || '') : '';
    }
  } catch (e) { showErr(e); }
  isMgr = false;   // even the mess admin opens the control panel only after typing the admin password
  if (blocked) { loaded = { members: true, entries: true }; render(); return; }
  if (!MID) {
    // not in any mess yet: no data is read. Shows verify / create-or-join screen
    loaded = { members: true, entries: true };
    watchJoinReq();
    render();
    return;
  }

  // the mess doc holds the invite code; the admin reads it for the control panel
  unsubs.push(db.collection('messes').doc(MID).onSnapshot(d => {
    inviteCode = d.exists ? (d.data().inviteCode || '') : '';
    messName = d.exists ? (d.data().name || '') : '';
    render();
  }, () => {}));
  // everyone can read members and entries (no photos there); pay slips live in slips/{id}, readable by owner and admin only
  unsubs.push(DBm('members').onSnapshot(s => {
    members = s.docs.map(d => ({ email: d.id, ...d.data() })); loaded.members = true;
    // admin rights can come from the member doc too (admin: true), so re-check after every members update
    isMgr = adminUnlocked;   // admin rights apply only after the password is entered
    if (isMgr && !adminLogsOn) { adminLogsOn = true; startAdminListeners(); }
    if (!isMgr && adminLogsOn) { adminUnsubs.forEach(u => u()); adminUnsubs = []; adminLogsOn = false; }
    render();
  }, () => { loaded.members = true; render(); }));   // not allowed to read members = not a member yet
  unsubs.push(DBm('entries').onSnapshot(s => {
    const prev = lastStatus;
    entries = s.docs.map(d => ({ id: d.id, ...d.data() }));
    lastStatus = {}; entries.forEach(x => { lastStatus[x.id] = x.status; });
    refreshMemberPopup();   // the open member account shows any change at once
    if (!isMgr) entries.forEach(x => {
      if (x.memberEmail === me && prev[x.id] && prev[x.id] !== x.status) {
        if (x.status === 'approved') notifyMe(lang === 'bn' ? 'তোমার বাজার অনুমোদিত হয়েছে' : 'Your entry was approved');
      }
    });
    loaded.entries = true; render();
  }, e => { if (isMgr || members.some(m => m.email === me)) showErr(e); }));
  if (isMgr) {
    unsubs.push(DBm('logs').orderBy('at', 'desc').limit(30).onSnapshot(s => {
      logs = s.docs.map(d => d.data()); if (page === 'settings') render();
    }, () => {}));
  }
  {
    // only the admin creates its own member doc here; every other member doc is created by the admin in "সব সদস্য"
    if (me === MESS_ADMIN) DBm('members').doc(me).get().then(s => {
      if (!s.exists) DBm('members').doc(me).set({ email: me, name: me.split('@')[0].toUpperCase(), days: 30, deposit: 0 });
    }).catch(() => {});
    unsubs.push(DBm('summary').doc('main').onSnapshot(d => {
      summary = d.exists ? d.data() : null; render();
    }, () => {}));
  }
  unsubs.push(DBm('monthly').onSnapshot(s => {
    monthlyList = s.docs.map(d => ({ id: d.id, ...d.data() })); render();
  }, () => {}));
  unsubs.push(DBm('notes').orderBy('at', 'desc').limit(50).onSnapshot(s => {
    notes = s.docs.map(d => ({ id: d.id, ...d.data() })); render();
  }, () => {}));
  unsubs.push(DBm('settings').doc('app').onSnapshot(d => {
    notice = (d.exists && d.data().notice) || '';
    closedMonths = (d.exists && d.data().closedMonths) || [];
    autoClosed = (d.exists && d.data().autoClosed) || [];
    lastNewMonth = (d.exists && d.data().lastNewMonth) || '';
    autoCloseLastMonth();
    autoNewMonth();
    bazarMode = (d.exists && d.data().bazarMode) || 'slip';
    showBadge = d.exists ? d.data().showBazarBadge !== false : true;
    updateBazarStatus();
    const th = d.exists ? d.data().theme : null;
    if (d.exists && Array.isArray(d.data().themes)) themesList = d.data().themes.filter(k => ALL_THEMES.includes(k));
    // a theme just picked here may still show the old value from the server for a moment: don't switch back to it
    if (th && th !== theme && ALL_THEMES.includes(th) && Date.now() - themePickedAt > 5000) { theme = th; localStorage.setItem('mh_theme', th); applyTheme(); }
    render();
  }, () => {}));
  resetForm();
  go(openAdminNext && isMgr ? 'admin' : 'home');
  openAdminNext = false;
});

/* ===== Back button: closes the top window first (popup, pay-slip viewer, confirm box), then goes to Home ===== */
const layers = [];   // open windows, newest last
function openLayer(name) {
  if (layers.some(l => l.name === name)) return;
  layers.push({ name });
  history.pushState({ layer: name }, '');
}
/* called by the window's own close button: removes it and drops the history entry we added */
let ignorePop = 0;   // popstate events caused by our own history.back() calls
function dropLayer(name) {
  const i = layers.map(l => l.name).lastIndexOf(name);
  if (i < 0) return;
  layers.splice(i, 1);
  ignorePop++;
  history.back();
}
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  const top = layers.pop();
  if (top) {
    if (top.name === 'memBox') closeMember();
    else if (top.name === 'imgBox') closeImg();
    else if (top.name === 'entryBox') closeEntryPop();
    else if (top.name === 'infoBox') closeInfo();
    else if (top.name === 'notesBox') closeNotesPop();
    else if (top.name === 'sheet') { const b = $('shCancel'); if (b && b.onclick) b.onclick(); }
    return;
  }
  if (page !== 'home') go('home', true);
});
function go(p, fromHistory = false) {
  if (p === 'admin' && !isMgr) { unlockAdmin(); return; }
  if (p === 'entries') {   // members have no Entries; the admin's Entries tab is inside the Control panel
    if (!isMgr) p = 'home';
    else { admTab = 'entries'; p = 'admin'; }
  }
  if (!fromHistory && p !== page) history.pushState({ page: p }, '');
  page = p;
  try { if (p !== 'admin') localStorage.setItem('mh_last_page', p); } catch (e) {}
  Object.entries(PAGES).forEach(([k, id]) => $(id).classList.toggle('hidden', k !== p));
  if ($('fabAdd')) $('fabAdd').classList.toggle('hidden', p !== 'home');
  const hc = $('hContent'); if (hc) { hc.classList.remove('pop'); void hc.offsetWidth; hc.classList.add('pop'); }
  render();
  window.scrollTo(0, 0);
  // iPhone keeps the page offset after the password keyboard closes; scroll to the top again once it settles
  if (p === 'admin') setTimeout(() => window.scrollTo(0, 0), 350);
}

function render() {

/* Members see the Admin tab; opening it asks for the admin password. Signing in as admin
   switches this device to the admin account (Firebase checks the password; wrong password changes nothing). */
async function unlockAdmin() {
  if (isMgr) { go('admin'); return; }
  const pw = await sheet({ title: t('enterAdminPw'), type: 'password', raw: true });
  if (!pw) return;
  let sess = null;
  try {
    sess = firebase.initializeApp(FB_CONFIG, 'adminSess' + Date.now());
    await sess.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); // admin session lives in memory only
    await sess.auth().signInWithEmailAndPassword(MESS_ADMIN, pw);   // the admin password belongs to the mess admin account, not to the member
  } catch (e) {
    if (sess) sess.delete().catch(() => {});
    toast(t('wrongPw'), true); return;
  }
  if (adminSess) adminSess.delete().catch(() => {});
  adminSess = sess;
  adminDb = sess.firestore();   // no offline cache for the admin session
  adminUnlocked = true;
  isMgr = true;
  startAdminListeners();
  // open the waiting list when something needs approval, otherwise the Entries list
  admTab = entries.some(x => x.status === 'submitted') ? 'wait' : 'entries';
  go('admin');

function approveReq(email) {
  const r = reqs.find(x => x.email === email) || {};

  ADB().collection('users').doc(email).set({ messId: MID, name: r.name || email.split('@')[0] })
    .then(() => ADBm('members').doc(email).set({ email, name: r.name || email.split('@')[0], days: 30, deposit: 0, joined: new Date().toISOString().slice(0, 7) }, { merge: true }))
    .then(() => ADBm('requests').doc(email).delete())
    .then(() => { toast(t('saved')); logAct('Approved join · ' + email); }).catch(showErr);
}
function rejectReq(email) {
  ADBm('requests').doc(email).delete()
    .then(() => { toast(t('deleted')); logAct('Rejected join · ' + email); }).catch(showErr);
}
let selReq = new Set();   // admin: selected join requests (emails)
function toggleReq(email, on) { on ? selReq.add(email) : selReq.delete(email); render(); }
function toggleAllReq(on) { selReq = on ? new Set(reqs.map(r => r.email)) : new Set(); render(); }
function approveSel() {
  const list = reqs.filter(r => selReq.has(r.email)); if (!list.length) return;
  const b = ADB().batch();
  list.forEach(r => {
    b.set(ADB().collection('users').doc(r.email), { messId: MID, name: r.name || r.email.split('@')[0] });
    b.set(ADBm('members').doc(r.email), { email: r.email, name: r.name || r.email.split('@')[0], days: 30, deposit: 0 }, { merge: true });
    b.delete(ADBm('requests').doc(r.email));

}

  const b = ADB().batch();
  list.forEach(r => b.delete(ADBm('requests').doc(r.email)));
  b.commit().then(() => { selReq = new Set(); toast(t('deleted')); logAct('Rejected join · ' + list.length + ' people'); }).catch(showErr);
}

/* ===== Pay-slip photos live in slips/{entryId}, not in entries ===== */
const slipCache = {};   // id -> data URL, or null when no slip exists
const slipPending = {};
function getSlip(id) {
  if (id in slipCache) return Promise.resolve(slipCache[id]);
  if (!slipPending[id]) {
    slipPending[id] = (isMgr ? ADBm : DBm)('slips').doc(id).get()
      .then(s => { slipCache[id] = s.exists ? s.data().data : null; return slipCache[id]; })
      .catch(() => undefined) // permission/network error: not cached, retried on next render
      .finally(() => { delete slipPending[id]; });
  }
  return slipPending[id];
}
function clearSlipCache() { Object.keys(slipCache).forEach(k => delete slipCache[k]); }
/* Placeholder for a slip; hydrateSlips() swaps it for the image once loaded */
function thumbFor(x) {
  if (x.photo) return `<img class="thumb" src="${esc(x.photo)}" alt="" onclick="openImg(this.src)">`; // legacy field, before migration
  return `<div class="thumb slipBox" data-slip="${esc(x.id)}" data-admin-entry="${x.addedByAdmin === true ? 1 : 0}" title="${t('viewSlip')}"></div>`;
}
function hydrateSlips() {
  document.querySelectorAll('.slipBox[data-slip]').forEach(el => {
    const id = el.dataset.slip;
    getSlip(id).then(src => {
      if (!el.isConnected) return;
      if (src === undefined) { // load failed: show a tappable retry instead of a blank box
        el.innerText = '⟳';
        el.title = lang === 'bn' ? 'ছবি লোড হয়নি — ট্যাপ করে আবার চেষ্টা করো' : 'Could not load slip — tap to retry';
        el.onclick = () => { el.innerText = '…'; getSlip(id).then(hydrateSlips); };
        return;
      }
      if (!src && el.dataset.adminEntry === '1') { el.className = 'thumb noslip'; el.title = lang === 'bn' ? 'স্লিপ ছাড়া admin এন্ট্রি' : 'Admin entry, no slip'; el.innerText = '—'; return; }
      if (!src) { el.className = 'thumb noslip'; el.title = t('needSlip'); el.innerText = '!'; return; }
      const img = document.createElement('img');
      img.className = 'thumb'; img.alt = ''; img.src = src; img.title = t('viewSlip');
      img.onclick = () => openImg(src);
      el.replaceWith(img);
    });
  });
}

/* plain-language reasons for a member's balance (shown in the ⓘ info and the popup) */
function explainLines(email, rate) {
  const bn = lang === 'bn';
  if (rate == null) return [bn ? 'দিন যোগ হলে হিসাব দেখা যাবে।' : 'The balance shows once days are set.'];
  const c = calc(), n = c.em.length || 1;
  const avgDays = c.tD / n;
  const b = bazarOf(email), d = depOf(email), days = daysOf(email), nm = nameOf(email);
  const who = email === me ? (bn ? 'তুমি' : 'You') : nm;   // the subject of each line
  const share = days * rate;               // meal cost = the member's share of the mess cost
  const diff = b - share;
  const L = [];
  if (Math.abs(diff) < 0.005) L.push(bn ? `${who} বাজার ৳${f2(b)} ${email === me ? 'দিয়েছ' : 'দিয়েছে'}, খাওয়ার খরচ ৳${f2(share)}, সমান।` : `${who} paid ৳${f2(b)}, equal to the meal cost ৳${f2(share)}.`);
  else if (diff > 0) L.push(bn ? `${who} বাজার ৳${f2(b)} ${email === me ? 'দিয়েছ' : 'দিয়েছে'}, খাওয়ার খরচ (৳${f2(share)}) এর চেয়ে ৳${f2(diff)} বেশি। এই টাকা ব্যালেন্সে যোগ হবে।` : `${who} paid ৳${f2(b)}, ৳${f2(diff)} more than the meal cost (৳${f2(share)}). This is added to the balance.`);
  else L.push(bn ? `${who} বাজার ৳${f2(b)} ${email === me ? 'দিয়েছ' : 'দিয়েছে'}, খাওয়ার খরচ (৳${f2(share)}) এর চেয়ে ৳${f2(-diff)} কম। এই ঘাটতি ব্যালেন্স থেকে কাটা হবে।` : `${who} paid ৳${f2(b)}, ৳${f2(-diff)} less than the meal cost (৳${f2(share)}). This shortfall is deducted from the balance.`);
  L.push(d > 0 ? (bn ? `${email === me ? 'তোমার' : nm + '-এর'} জমা ৳${f2(d)} আছে, তাই হিসাবে যোগ হয়েছে।` : `${who === 'You' ? 'Your' : nm + `'s`} deposit of ৳${f2(d)} is added to the balance.`) : (bn ? 'কোনো জমা নেই।' : 'No deposit.'));
  const dayTxt = days === Math.round(avgDays) ? (bn ? 'গড়ের সমান' : 'same as the average') : days < avgDays ? (bn ? 'গড়ের চেয়ে কম, তাই খাওয়ার খরচ কম' : 'below average, so meal cost is lower') : (bn ? 'গড়ের চেয়ে বেশি, তাই খাওয়ার খরচ বেশি' : 'above average, so meal cost is higher');
  L.push(bn ? `${who} ${days} দিন ${email === me ? 'খেয়েছ' : 'খেয়েছে'} (মেসের গড় ${avgDays.toFixed(1)} দিন), ${dayTxt}।` : `${who} had ${days} days (mess average ${avgDays.toFixed(1)}), ${dayTxt}.`);
  L.push(bn ? `${email === me ? 'তোমার' : nm + '-এর'} খাওয়ার খরচ = ${days} দিন × ৳${f2(rate)} = ৳${f2(share)}।` : `Meal cost = ${days} days × ৳${f2(rate)} = ৳${f2(share)}.`);
  const net = b + d - share;
  L.push(bn ? `মোট হিসাব = বাজার ৳${f2(b)} + জমা ৳${f2(d)} − খাওয়া ৳${f2(share)} = ${net >= 0 ? '+' : '−'} ৳${f2(Math.abs(net))}।` : `Balance = paid ৳${f2(b)} + deposit ৳${f2(d)} − meal ৳${f2(share)} = ${net >= 0 ? '+' : '−'} ৳${f2(Math.abs(net))}.`);
  return L;
}
/* same lines, but the deposit and days lines are flagged red when they differ from the default (no deposit, 30 days) */
function explainItems(email, rate) {
  const lines = explainLines(email, rate);

  const d = depOf(email), days = daysOf(email);
  return lines.map((t, i) => ({ t, red: (i === 1 && d > 0) || (i === 2 && days !== 30) }));
}

/* profile photo: small square JPEG (160px) so the members list stays light */
function avatarShrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const side = Math.min(img.width, img.height), S = 160;
        const c = document.createElement('canvas'); c.width = S; c.height = S;
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
        res(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function pickAvatar() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
