/* round avatar: the member's photo if they have one, otherwise the first letter on a colour */
function avHtml(email, style = '') {
  const m = memberOf(email) || {};
  const ch = (nameOf(email)[0] || '?').toUpperCase();
  const hue = [...String(email)].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  if (m.photo) return `<div class="mav" style="${style};padding:0;overflow:hidden"><img src="${esc(m.photo)}" alt="" style="width:100%;height:100%;object-fit:cover"></div>`;
  return `<div class="mav" style="${style};background:linear-gradient(135deg,hsl(${hue},70%,55%),hsl(${(hue + 40) % 360},70%,60%))">${esc(ch)}</div>`;
}
function compress(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 800 / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function saveEntry() {
  const date = $('fDate').value, amt = num($('fAmt').value), note = $('fNote').value.trim();
  const f = $('fPhoto').files[0];
  if (!date || !(amt > 0)) { formErr(t('needDateAmt')); return; }
  const oldE = editId ? entries.find(e => e.id === editId) : null;
  if (closedMonths.includes(String(date).slice(0, 7)) || (oldE && isClosed(oldE))) {
    formErr(lang === 'bn' ? 'এই মাস বন্ধ আছে' : 'This month is closed'); return;
  }
  if (!f && !editId && !isMgr) { formErr(t('needSlip')); return; }   // members must attach a slip; the admin may add the entry now and the slip later
  $('fMsg').innerText = '…'; $('fMsg').classList.remove('err');
  try {
    const photo = f ? await compress(f) : null;
    const W = isMgr ? ADBm : DBm;
    if (editId) {
      const upd = { date, amount: amt, note };
      if (!isMgr) { upd.status = 'submitted'; upd.reason = ''; } // member edits go back to review
      await W('entries').doc(editId).update(upd);
      if (photo) {
        await W('slips').doc(editId).set({ data: photo });
        slipCache[editId] = photo;
      }
    } else {
      // entry first (the slip rule checks that the entry exists), then the photo
      const who = isMgr && $('fMember') ? $('fMember').value : me;
      const ref = await W('entries').add({ memberEmail: who, date, amount: amt, note, status: isMgr ? 'approved' : 'submitted', reason: '', createdAt: Date.now(), addedByAdmin: isMgr });   // an admin's entry counts at once
      try {
        if (photo) { await W('slips').doc(ref.id).set({ data: photo }); slipCache[ref.id] = photo; }
      } catch (e) {
        await ref.delete().catch(() => {}); // no entry without its pay slip
        throw e;
      }
    }
    resetForm();
    toast(t('saved'));
    if ($('entryBox') && !$('entryBox').classList.contains('hidden')) closeEntryPop();
    if (isMgr && memOpen && $('memBox') && !$('memBox').classList.contains('hidden')) openMember(memOpen);
  } catch (e) { formErr(t('errPrefix') + e.message); toast(t('errPrefix') + (e.code || '') + ' ' + e.message, true); console.error('save entry', e); }
}

/* deletes everything of one mess in batches (only allowed by the rules when the mess is archived) */
async function deleteMessAll(m) {
  const mref = db.collection('messes').doc(m.id);
  for (const col of ['entries', 'slips', 'notes', 'members', 'summary', 'settings', 'requests', 'logs', 'monthly']) {
    let snap;
    do {
      snap = await mref.collection(col).limit(400).get();
      if (!snap.empty) { const b = db.batch(); snap.docs.forEach(d => b.delete(d.ref)); await b.commit(); }
    } while (!snap.empty);
  }
  const ib = await mref.collection('inbox').get();
  for (const d of ib.docs) {
    const its = await d.ref.collection('items').get();
    if (!its.empty) { const b = db.batch(); its.docs.forEach(x => b.delete(x.ref)); await b.commit(); }
    await d.ref.delete();
  }
  const us = await db.collection('users').where('messId', '==', m.id).get();
  for (const d of us.docs) await d.ref.delete();
  if (m.code) await db.collection('codes').doc(m.code).delete().catch(() => {});
  await mref.delete();
}

async function delEntry(id) {
  const target = entries.find(e => e.id === id);
  if (!isMgr && target && target.addedByAdmin === true) { toast(lang === 'bn' ? 'অ্যাডমি যোগ করা এন্ট্রি মুছা যাবে না' : 'Admin-added entries cannot be deleted', true); return; }
  const ok = await sheet({ title: `${t('confirmDel')} · ${target ? nameOf(target.memberEmail) : ''} · ${target ? f2(target.amount) : ''}`, input: false, okText: t('del') });
  if (!ok) return;
  // the admin deletes the entry together with its pay slip: the admin password is needed
  if (isMgr && !(await checkAdminPw())) return;
  const x = entries.find(e => e.id === id) || {};
  const DB = isMgr ? ADBm : DBm;
  // admin deletes someone else's entry: first leave that member a notice with the date, amount and a copy of the pay slip
  if (isMgr && x.memberEmail && x.memberEmail !== me) {
    let slip = '';
    try { const sl = await ADBm('slips').doc(id).get(); if (sl.exists) slip = sl.data().data || ''; } catch (e) {}
    const tooBig = slip.length > 900000;
    if (tooBig) slip = '';
    try {
      await ADBm('inbox').doc(x.memberEmail).collection('items').add({ to: x.memberEmail, date: x.date || '', amount: Number(x.amount) || 0, note: x.note || '', slip, slipTooBig: tooBig, by: me, at: Date.now(), readAt: null });
    } catch (e) { showErr(e); return; }
  }
  // entry first: if this is refused, nothing is removed and the reason is shown
  try { await DB('entries').doc(id).delete(); }
  catch (e) { showErr(e); return; }
  // the pay slip is removed separately; a leftover slip is harmless, so its failure does not block the delete
  DB('slips').doc(id).delete().catch(() => {});
  delete slipCache[id];
  toast(t('deleted'));
  if (isMgr) logAct('Deleted · ' + nameOf(x.memberEmail) + ' · ' + f2(x.amount));
}

/* ---- backup: the mess admin downloads all of this mess's data as one file, encrypted with a password ---- */
function backupB64(buf) {
  const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
async function encryptBackup(text, pw) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
  return { app: 'mess-hisab-pro', v: 1, kdf: 'PBKDF2-SHA256-200000', salt: backupB64(salt), iv: backupB64(iv), data: backupB64(ct) };
}
async function makeBackup() {
  const bn = lang === 'bn';
  if (me !== MESS_ADMIN) return toast(bn ? 'শুধু mess admin ব্যাকআপ নিতে পারবে' : 'Only the mess admin can make a backup', true);
  const p1 = String((await sheet({ title: bn ? 'ব্যাকআপের password দাও (ভুললে ফাইল খোলা যাবে না)' : 'Password for the backup (you need it to open the file)', type: 'password', raw: true })) || '');
  if (!p1) return;
  if (p1.length < 6) return toast(bn ? 'কমপক্ষে ৬ অক্ষর' : 'At least 6 characters', true);
  const p2 = String((await sheet({ title: bn ? 'password আবার লেখো' : 'Type the password again', type: 'password', raw: true })) || '');
  if (p1 !== p2) return toast(bn ? 'দুটো password মিলছে না' : 'Passwords do not match', true);
  toast(bn ? 'ব্যাকআপ তৈরি হচ্ছে…' : 'Making backup…');
  try {
    const all = async c => (await DBm(c).get()).docs.map(d => ({ id: d.id, data: d.data() }));
    const sum = await DBm('summary').doc('main').get();
    const set = await DBm('settings').doc('app').get();
    const payload = {
      app: 'mess-hisab-pro', v: 1, mid: MID, at: new Date().toISOString(),
      entries: await all('entries'), slips: await all('slips'), members: await all('members'),
      notes: await all('notes'), monthly: await all('monthly'), logs: await all('logs'),
      summary: sum.exists ? sum.data() : null, settings: set.exists ? set.data() : null
    };
    const box = await encryptBackup(JSON.stringify(payload), p1);
    const url = URL.createObjectURL(new Blob([JSON.stringify(box)], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = `mess-backup-${isoToday()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    logAct('Backup downloaded');
    toast(bn ? 'ব্যাকআপ download হয়েছে' : 'Backup downloaded');
  } catch (e) { showErr(e); }
}

async function changePassword() {
  const cur = await sheet({ title: t('curPw'), type: 'password', raw: true });
  if (!cur) return;
  const n1 = await sheet({ title: t('newPw'), type: 'password', ph: t('pwShort'), raw: true });
  if (!n1) return;
  if (n1.length < 6) { toast(t('pwShort'), true); return; }
  const n2 = await sheet({ title: t('confPw'), type: 'password', raw: true });
  if (n2 === null) return;
  if (n1 !== n2) { toast(t('pwMismatch'), true); return; }
  try {
    const user = auth.currentUser;
    // Firebase needs a fresh sign-in before changing the password
    await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email, cur));
    await user.updatePassword(n1);
    toast(t('pwChanged'));
  } catch (e) {
    const wrong = e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential';
    toast(wrong ? t('wrongPw') : t('errPrefix') + e.message, true);
  }
}
async function resetAll() {
  // closed months: the rules block deleting their entries, so a reset would stop halfway. Refuse until they are reopened.
  if (closedMonths.length) {
    toast(lang === 'bn' ? 'বন্ধ মাস আছে, তাই এখন reset করা যাবে না। আগে ব্যাকআপ নাও।' : 'Closed months exist, so reset is blocked. Take a backup first.', true);
    return;
  }
  const sure = await sheet({ title: t('resetWarn'), input: false, okText: t('resetAll') });
  if (!sure) return;
  const pw = await sheet({ title: t('enterAdminPw'), type: 'password', raw: true });
  if (!pw) return;
  try {
    const user = ADBAuth().currentUser;
    if (!user) { toast(t('errPrefix') + (lang === 'bn' ? 'আগে অ্যাডমিন হিসেবে লগইন করো' : 'Sign in as admin first'), true); return; }
    await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email, pw));
  } catch (e) {
    const wrong = ['auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials'].includes(e && e.code);
    if (wrong) toast(t('wrongPw'), true); else showErr(e);
    return;
  }
  try {
    const [eSnap, sSnap, nSnap, mSnap] = await Promise.all([
      ADBm('entries').get(), ADBm('slips').get(),
      ADBm('notes').get(), ADBm('members').get()]);
    const ops = [
      ...eSnap.docs.map(d => ['del', d.ref]), ...sSnap.docs.map(d => ['del', d.ref]), ...nSnap.docs.map(d => ['del', d.ref]),
      ...mSnap.docs.map(d => ['reset', d.ref])];   // members stay, but days go back to 30 and deposit to 0
    let batch = ADB().batch(), n = 0;
    for (const [kind, ref] of ops) {
      if (kind === 'del') batch.delete(ref); else batch.update(ref, { days: 30, deposit: 0 });
      n++;
      if (n % 400 === 0) { await batch.commit(); batch = ADB().batch(); }
    }
    await batch.commit();
    clearSlipCache();
    await ADBm('summary').doc('main').set({ tB: 0, tD: 0, rate: 0, updated: Date.now() });

async function decryptBackup(box, pw) {
  const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: dec(box.salt), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: dec(box.iv) }, key, dec(box.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function restoreJSON(file) {
  if (!file) return;
  const ok = await sheet({ title: lang === 'bn' ? 'ব্যাকআপ থেকে ফিরিয়ে আনবে? একই ID-র ডেটা বদলে যাবে।' : 'Restore backup? Matching records will be overwritten.', input: false, okText: lang === 'bn' ? 'ফিরিয়ে আনো' : 'Restore' });
  if (!ok) { { const rf = $('restoreFile'); if (rf) rf.value = ''; }; return; }
  try {
    const raw = JSON.parse(await file.text());
    let d = raw;
    if (raw && raw.salt && raw.iv && raw.data) {   // encrypted backup: ask for its password
      const pw = String((await sheet({ title: lang === 'bn' ? 'ব্যাকআপের password দাও' : 'Backup password', type: 'password', raw: true })) || '');
      if (!pw) { { const rf = $('restoreFile'); if (rf) rf.value = ''; }; return; }
      try { d = await decryptBackup(raw, pw); }
      catch (e) { { const rf = $('restoreFile'); if (rf) rf.value = ''; }; return toast(lang === 'bn' ? 'password ভুল, অথবা ফাইল নষ্ট' : 'Wrong password, or the file is damaged', true); }
      d = {
        members: (d.members || []).map(x => ({ email: x.id, ...x.data })),
        entries: (d.entries || []).map(x => ({ id: x.id, ...x.data })),
        slips: (d.slips || []).map(x => ({ id: x.id, data: x.data.data }))
      };
    }
    const small = [], slipOps = [];
    (d.members || []).forEach(m => small.push({ ref: ADBm('members').doc(m.email), data: (({ email, ...r }) => r)(m) }));
    (d.entries || []).forEach(x => {
      const { id, photo, ...r } = x; // old backups carry the photo inside the entry: move it to slips
      small.push({ ref: ADBm('entries').doc(id), data: { ...r, photo: firebase.firestore.FieldValue.delete() } });
      if (photo) slipOps.push({ ref: ADBm('slips').doc(id), data: { data: photo } });
    });
    (d.slips || []).forEach(s => slipOps.push({ ref: ADBm('slips').doc(s.id), data: { data: s.data } }));
    for (let i = 0; i < small.length; i += 400) {
      const batch = ADB().batch();
      small.slice(i, i + 400).forEach(o => batch.set(o.ref, o.data, { merge: true }));
      await batch.commit();
    }
    // photos can be ~200 KB each, so keep slip batches small (Firestore caps a batch at 10 MiB)
    for (let i = 0; i < slipOps.length; i += 10) {
      const batch = ADB().batch();
      slipOps.slice(i, i + 10).forEach(o => batch.set(o.ref, o.data));
      await batch.commit();
    }
    clearSlipCache();
    toast(t('saved')); logAct('Backup restored');
  } catch (e) { showErr(e); }
  { const rf = $('restoreFile'); if (rf) rf.value = ''; };
}
/* One-time: move pay-slip photos from entries.photo into slips/{id} */
async function migrateSlips() {
  const ok = await sheet({ title: lang === 'bn' ? 'পুরোনো ছবি slips-এ সরাবে? একবারই চালাও।' : 'Move old photos to slips? Run once.', input: false, okText: lang === 'bn' ? 'সরাও' : 'Move' });
  if (!ok) return;
  try {
    const snap = await ADBm('entries').get();
    const todo = snap.docs.filter(d => d.data().photo);
    if (!todo.length) { toast(lang === 'bn' ? 'কোনো পুরোনো ছবি নেই' : 'No old photos found'); return; }
    for (let i = 0; i < todo.length; i += 10) {
      const chunk = todo.slice(i, i + 10);
      // copy first, and only then remove the photo from the entry
      const copy = ADB().batch();
      chunk.forEach(d => copy.set(ADBm('slips').doc(d.id), { data: d.data().photo }));
      await copy.commit();
      const strip = ADB().batch();
      chunk.forEach(d => strip.update(d.ref, { photo: firebase.firestore.FieldValue.delete() }));
      await strip.commit();
    }
    clearSlipCache();
    toast(t('saved')); logAct('Photos moved to slips · ' + todo.length);
  } catch (e) { showErr(e); }
}
let migrating = false;
/* Moves legacy photos (entries.photo) into slips/{id}, admin only. Runs by itself, so no old photo stays readable by members. */
async function autoMigrate() {
  if (migrating) return; migrating = true;
  try {
    const snap = await ADBm('entries').get();
    const todo = snap.docs.filter(d => d.data().photo);
    for (let i = 0; i < todo.length; i += 10) {
      const chunk = todo.slice(i, i + 10);
      const copy = ADB().batch();   // copy first, remove from the entry only after the copy succeeded
      chunk.forEach(d => copy.set(ADBm('slips').doc(d.id), { data: d.data().photo }));
      await copy.commit();
      const strip = ADB().batch();
      chunk.forEach(d => strip.update(d.ref, { photo: firebase.firestore.FieldValue.delete() }));
      await strip.commit();
    }
    if (todo.length) { clearSlipCache(); logAct('Photos moved to slips (auto) · ' + todo.length); }
  } catch (e) { /* tried again on the next render */ }
  finally { migrating = false; }
}

function prevMonthKey(k) {
  const [y, m] = k.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
/* new month: the old month is saved and closed, everyone goes back to 30 days, and the app opens on the new month.
   Nothing is deleted: the old month's bazar and slips stay, and can be seen with the month buttons. */
async function newMonthReset() {
  const bn = lang === 'bn';
  const ok = await sheet({
    title: bn ? 'নতুন মাস শুরু করবে? সবার দিন ৩০ হবে, আগের মাসের হিসাব সেভ থাকবে।' : 'Start a new month? Everyone goes to 30 days. The old month is saved.',
    input: false, okText: bn ? 'শুরু করো' : 'Start'
  });
  if (!ok) return;
  const cur = new Date().toISOString().slice(0, 7);
  const prev = prevMonthKey(cur);
  const close = closedMonths.includes(prev) ? closedMonths : [...closedMonths, prev];
  if (!closedMonths.includes(prev)) DBm('monthly').doc(prev).set(monthSnapshot(prev)).catch(() => {});   // saved before the days change
  const b = ADB().batch();
  members.forEach(m => b.update(ADBm('members').doc(m.email), { days: 30 }));
  b.set(ADBm('settings').doc('app'), { closedMonths: close, autoClosed: [...autoClosed, prev], lastNewMonth: cur }, { merge: true });
  b.commit().then(() => {
    month = cur;
    toast(t('saved'));
    logAct((bn ? 'নতুন মাস শুরু · ' : 'New month started · ') + cur);
    render();
  }).catch(showErr);
}

  rose:   { bn: 'গোলাপ',      en: 'Rose',    light: false },
  mint:   { bn: 'মিন্ট',      en: 'Mint',    light: true  },
  realmadrid: { bn: 'রিয়াল মাদ্রিদ', en: 'Real Madrid', light: true },
  barcelona:  { bn: 'বার্সেলোনা',    en: 'Barcelona',   light: false },
  bangladesh: { bn: 'বাংলাদেশ',      en: 'Bangladesh',  light: true },
  france:     { bn: 'ফ্রান্স',        en: 'France',      light: false }

const ALL_THEMES = ['dark', 'light', 'auto', ...Object.keys(PRESET_THEMES)];

function themeLabel(k) {

}
function themeAdminHtml() {

function saveThemes() {
  ADBm('settings').doc('app').set({ themes: themesList }, { merge: true }).catch(showErr);
}
function removeTheme(k) {
  if (!isMgr || k === 'dark') return;
  themesList = themesList.filter(x => x !== k);
  if (theme === k) { theme = 'dark'; localStorage.setItem('mh_theme', 'dark'); applyTheme(); ADBm('settings').doc('app').set({ theme: 'dark' }, { merge: true }).catch(showErr); }
  saveThemes(); render();
}
function addTheme(k) {
  if (!isMgr || themesList.includes(k)) return;
  themesList = [...themesList, k]; saveThemes(); render();
}
function applyTheme() {
  const eff = theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : theme;
  const preset = PRESET_THEMES[theme] ? theme : null;
  document.body.classList.toggle('light', eff === 'light' || !!(preset && PRESET_THEMES[preset].light));
  Object.keys(PRESET_THEMES).forEach(p => document.body.classList.toggle('th-' + p, p === preset));
}

async function toggleFreeze(email, freeze) {
  const bn = lang === 'bn';
  const who = nameOf(email);
  const ok = await sheet({
    title: freeze
      ? (bn ? `${who} কে ফ্রিজ করবে? সে নতুন বাজার যোগ বা বদলাতে পারবে না। তার আগের হিসাব থাকবে।` : `Freeze ${who}? They cannot add or change bazar entries. Their history stays.`)
      : (bn ? `${who} কে আবার চালু করবে?` : `Unfreeze ${who}?`),
    input: false, okText: freeze ? (bn ? 'ফ্রিজ করো' : 'Freeze') : (bn ? 'চালু করো' : 'Unfreeze')

  if (!ok) return;
  ADBm('members').doc(email).set({ frozen: freeze }, { merge: true })
    .then(() => { toast(t('saved')); logAct((freeze ? 'Frozen · ' : 'Unfrozen · ') + email); if (memOpen) openMember(memOpen); })
    .catch(showErr);
}

/* ================= SUBSCRIPTION ================= */
function isoToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// tap-to-choose plan picker: free / 7 days / 1 month / 1 year; resolves to the plan key or null
function pickPlan(cur, bn) {
  return new Promise(res => {
    const opts = [
      ['free', bn ? 'ফ্রি' : 'Free', bn ? 'কোনো subscription লাগবে না' : 'No subscription needed'],
      ['days7', bn ? '৭ দিন' : '7 days', bn ? '৭ দিন পর নিজে থেকে বন্ধ হবে' : 'Ends automatically after 7 days'],
      ['month', bn ? '১ মাস' : '1 month', bn ? 'প্রতি মাসে renewal code' : 'Renewal code every month'],
      ['year', bn ? '১ বছর' : '1 year', bn ? 'বছরে একবার renewal code' : 'Renewal code once a year']
    ];
    const box = document.createElement('div');
    box.id = 'planPick';
    box.style.cssText = 'position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px';
    box.innerHTML = `<div class="card" style="width:100%;max-width:420px">
      <h3 style="margin:0 0 8px">${bn ? 'প্ল্যান বাছো' : 'Choose plan'}</h3>
      <div class="optList">${opts.map(([k, l, d]) => `<button class="optRow ${cur === k ? 'on' : ''}" data-k="${k}"><span style="text-align:left"><b>${l}</b><br><span class="sub" style="font-size:12px">${d}</span></span>${cur === k ? '<span class="optTick">✓</span>' : ''}</button>`).join('')}</div>
      <button class="ghost" id="planCancel" style="width:100%;margin-top:10px">${bn ? 'বাতিল' : 'Cancel'}</button></div>`;
    document.body.appendChild(box);
    const done = v => { box.remove(); res(v); };
    box.querySelectorAll('.optRow').forEach(b => { b.onclick = () => done(b.dataset.k); });
    box.querySelector('#planCancel').onclick = () => done(null);
    box.onclick = e => { if (e.target === box) done(null); };
  });
}
// plans: 'days7' = 7 days, 'month' = 1 month
function planFrom(text) {
  const t = String(text || '').trim().toLowerCase();
  if (/free|ফ্রি/.test(t)) return 'free';
  if (/year|বছর/.test(t)) return 'year';
  return (/^7|day|দিন|week/.test(t)) ? 'days7' : 'month';
}
function planLabel(p, bn) {
  if (p === 'free') return bn ? 'ফ্রি' : 'Free';
  if (p === 'year') return bn ? '1 বছর' : '1 year';
  return p === 'days7' ? (bn ? '7 দিন' : '7 days') : (bn ? '1 মাস' : '1 month');
}
function addPeriod(ymd, cycle) {
  const [y, mo, da] = ymd.split('-').map(Number);
  const d = new Date(y, mo - 1, da);
  if (cycle === 'free') return ymd;
  if (cycle === 'days7') d.setDate(d.getDate() + 7);
  else if (cycle === 'year') d.setFullYear(d.getFullYear() + 1);
  else d.setMonth(d.getMonth() + 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

        <button class="pri" onclick="superActId('${m.id}','subPaid')">${bn ? 'পেমেন্ট নিলাম' : 'Record payment'}</button>
        <button class="ghost" onclick="superActId('${m.id}','subCode')">${bn ? 'কোড তৈরি' : 'Make code'}</button>

  const bn = lang === 'bn';
  const s = MESS_SUB || {};

    : `<span style="color:var(--bad)">${bn ? 'মেয়াদ শেষ' : 'Expired'} (${s.paidUntil})</span>`;
  const real = v => v && !String(v).includes('CHANGE_ME');
  const btns = [];
  if (real(PAY_LINKS.paypal)) btns.push(`<a class="pri" href="${PAY_LINKS.paypal}" target="_blank" rel="noopener">PayPal</a>`);
  if (real(PAY_LINKS.wise)) btns.push(`<a class="pri" href="${PAY_LINKS.wise}" target="_blank" rel="noopener">Wise</a>`);

  return `<div class="sub">${bn ? 'স্ট্যাটাস' : 'Status'}: <b>${status}</b></div>

      <input id="subCodeIn" placeholder="ABCD1234" autocapitalize="characters" style="width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;text-transform:uppercase"></div>

}
// mess admin: use a one-time code from the super admin to extend the subscription
async function redeemSubCode() {
  const bn = lang === 'bn';
  const code = String((document.getElementById('subCodeIn') || {}).value || '').trim().toUpperCase();
  if (!code) return toast(bn ? 'কোড লেখো' : 'Enter the code', true);
  try {
    const cs = await db.collection('subCodes').doc(code).get();
    if (!cs.exists) return toast(bn ? 'কোডটি ভুল' : 'Invalid code', true);
    const c = cs.data();
    if (c.used) return toast(bn ? 'এই কোডটি আগে ব্যবহার হয়েছে' : 'This code is already used', true);
    if (c.messId !== MID) return toast(bn ? 'এই কোড এই মেসের নয়' : 'This code is for another mess', true);
    const today = isoToday();
    const amount = c.amount || 0;
    const b = db.batch();
    b.update(db.collection('messes').doc(MID), {
      'subscription.paidUntil': c.paidUntil,
      'subscription.cycle': c.cycle || 'month',
      'subscription.amount': amount,
      'subscription.lastPaid': today,
      'subscription.lastCode': code,
      'subscription.history': firebase.firestore.FieldValue.arrayUnion({ date: today, amount, method: 'code', ref: code })
    });
    b.update(db.collection('subCodes').doc(code), { used: true, usedAt: Date.now(), usedBy: me });
    await b.commit();
    MESS_SUB = { ...(MESS_SUB || {}), paidUntil: c.paidUntil, cycle: c.cycle || 'month', amount, lastPaid: today, lastCode: code };
    toast(bn ? 'সাবস্ক্রিপশন সক্রিয় হয়েছে' : 'Subscription activated');
    setTimeout(() => location.reload(), 900);
  } catch (e) {
    toast(bn ? 'সক্রিয় করা যায়নি, কোড বা অনুমতি দেখো' : 'Could not activate, check the code', true);
  }
}
