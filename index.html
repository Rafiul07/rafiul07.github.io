<style>
:root{--bg:#0a0a12;--card:#15152a;--card2:#1c1c38;--tx:#f1f1f7;--sub:#8b8ba7;--bd:#262643;--inp:#0d0d1a;--p:#a855f7;--s:#22d3ee;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--blue:#60a5fa}
body.light{--bg:#f2f4fa;--card:#ffffff;--card2:#f5f6fb;--tx:#14141f;--sub:#60647a;--bd:#e2e5ee;--inp:#f5f6fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Bengali',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:calc(190px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.hidden{display:none!important}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;color:var(--tx);background:var(--card2);transition:transform .08s,opacity .2s}
button:active{transform:scale(.97)}
.pri{background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12}
.ok{background:var(--ok);color:#06150e}
.warn{background:var(--warn);color:#2a1d00}
.bad{background:var(--bad);color:#2a0606}
.ghost{background:transparent;border:1px solid var(--bd)}
input,select,textarea{font:inherit;width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:16px;margin-top:6px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(168,85,247,.18)}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{font-weight:900;letter-spacing:.5px;font-size:17px;background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:11px;font-weight:700;letter-spacing:.6px;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--sub);border:1px solid var(--bd)}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.3px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,rgba(168,85,247,.22),rgba(34,211,238,.12));border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px}
.hero .big{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.kpi small{display:block;color:var(--sub);font-size:12px;margin-bottom:6px}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:999px;font-weight:700;white-space:nowrap;color:#06150e}
.b-ok{background:var(--ok)}.b-bad{background:var(--bad);color:#2a0606}.b-s{background:var(--s)}.b-p{background:var(--p);color:#0a0a12}
.b-sub{background:var(--blue);color:#06142a}.b-warn{background:var(--warn);color:#2a1d00}
.lbl{font-size:12.5px;color:var(--sub);font-weight:700;margin:14px 0 2px}
.lbl:first-child{margin-top:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--inp);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-top:8px}
.seg button{background:transparent;color:var(--sub);padding:9px 6px;font-size:13.5px;border-radius:10px}
.seg button.on{background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 0;border-top:1px solid var(--bd);background:none;color:var(--tx);border-radius:0;text-align:left;font-weight:600}
.entry{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.entry:first-child{border-top:0;padding-top:0}
.thumb{width:60px;height:60px;border-radius:14px;object-fit:cover;border:1px solid var(--bd);flex-shrink:0;background:var(--inp);cursor:pointer}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{padding:7px 11px;font-size:12.5px;border-radius:10px}
.barRow{padding:12px 0;border-top:1px solid var(--bd)}
.barRow:first-child{border-top:0;padding-top:0}
.track{height:10px;background:var(--inp);border:1px solid var(--bd);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.fill{height:100%;background:linear-gradient(90deg,var(--p),var(--s));border-radius:999px;transition:width .5s}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;background:var(--card);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;padding:6px 0;border-radius:12px}
.nav button.on{color:var(--s)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:380px;padding:24px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay img{max-width:100%;max-height:80vh;border-radius:14px;transition:transform .2s}
.viewBar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.viewBar button{background:var(--card)}
.sheetWrap{position:fixed;inset:0;z-index:2147483600;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px 16px 120px}
.sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet .row button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:var(--card2);border:1px solid var(--bd);padding:10px 18px;border-radius:999px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.toast.err{border-color:var(--bad);color:var(--bad)}
.empty{text-align:center;padding:22px 8px;color:var(--sub)}
.mcard .row input{margin-top:0}
.mgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.mf{display:flex;flex-direction:column;gap:4px;min-width:0}
.mf span{font-size:12px;font-weight:600;opacity:.7}
.mf input{width:100%;min-width:0}
.mcard .pri.grow{flex:1}
.kpis.three{grid-template-columns:repeat(3,1fr);gap:8px}
.kpis.three .kpi{padding:12px 10px}
.kpis.three .kpi b{font-size:clamp(14px,4.2vw,18px);overflow-wrap:anywhere}
input[type=file]{padding:9px;font-size:14px;color:var(--sub)}
input[type=file]::file-selector-button{font:inherit;font-weight:700;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-right:10px;cursor:pointer}
.sample{margin-top:14px;padding:14px;border-radius:14px;background:var(--inp);border:1px dashed var(--bd);color:var(--tx)}
.iconBox{width:38px;height:38px;border-radius:12px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--card2);color:var(--sub);white-space:nowrap}
@media(min-width:700px){.wrap{padding:20px}}

/* ===== mobile polish ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:15.5px;line-height:1.5}
.top{padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.card{padding:16px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
body.light .card{box-shadow:0 1px 2px rgba(20,20,40,.06),0 6px 18px rgba(20,20,40,.07)}
.card h3{font-size:13px;letter-spacing:.2px;margin-bottom:14px}
.kpi{padding:14px}
.kpi b{font-size:clamp(16px,4.8vw,20px)}
.hero{padding:18px}
.hero .big{font-size:clamp(24px,8vw,32px)}
.thumb{width:56px;height:56px;border-radius:12px}
button{min-height:42px}
.acts button{min-height:36px;padding:8px 12px;font-size:12.5px}
.seg button{min-height:42px}
.item{min-height:52px}
.nav{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav button{font-size:12px;min-height:54px}
.toast{font-size:14px}
input,select,textarea{min-height:46px}
body.light{--bg:#eef1f8}
body.light .top{background:#ffffff}
body.light .nav{background:#ffffff}
body.light input,body.light select,body.light textarea{background:#f7f8fc}
@media (max-width:380px){
  body{font-size:14.5px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}
  .kpi small{font-size:11.5px}
  .hero{padding:15px}
  .card{padding:13px;border-radius:16px}
  .entry{gap:10px}
  .thumb{width:50px;height:50px}
}
/* ===== design pass ===== */
body{font-variant-numeric:tabular-nums}
.card,.kpi,.hero{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--bd);color:var(--sub);padding:8px 14px;border-radius:999px;font-size:13px;min-height:36px}
.chip.on{background:linear-gradient(135deg,var(--p),var(--s));color:#0a0a12;border-color:transparent}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#0a0a12;font-size:13px;flex-shrink:0}
.noslip{display:flex;align-items:center;justify-content:center;color:var(--bad);font-weight:900;font-size:20px;border:1px dashed rgba(248,113,113,.6);background:rgba(248,113,113,.08)}
.empty::before{content:'📭';display:block;font-size:28px;margin-bottom:6px}
.dot{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#2a0606;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.nav button{position:relative}
.kpi{background:linear-gradient(180deg,var(--card),var(--card2))}
body.light .hero{background:linear-gradient(135deg,rgba(168,85,247,.10),rgba(34,211,238,.08))}
body.light .track,body.light .thumb{background:#eef0f7}
body.light .kpi{background:#fff}
/* ===== style pass ===== */
body::before{content:'';position:fixed;inset:0 0 auto 0;height:340px;background:radial-gradient(60% 100% at 50% 0%,rgba(168,85,247,.20),transparent 70%);pointer-events:none;z-index:-1}
body.light::before{background:radial-gradient(60% 100% at 50% 0%,rgba(168,85,247,.10),transparent 70%)}
.top{background:rgba(21,21,42,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.light .top{background:rgba(255,255,255,.78)}
.card{border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.25)}
body.light .card{box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,20,40,.06),0 8px 22px rgba(20,20,40,.06)}
.hero{border-radius:18px;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--p),var(--s)) border-box;box-shadow:0 10px 30px rgba(168,85,247,.12)}
body.light .hero{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--p),var(--s)) border-box}
.kpi{border-radius:18px;padding:15px}
.kpi small{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.1px}
.kpi b{font-size:clamp(18px,5vw,22px);font-weight:900;letter-spacing:-.3px}
.hero .big{font-size:clamp(26px,8vw,34px);font-weight:900;letter-spacing:-.5px}
input,select,textarea{border-radius:14px}
button{border-radius:14px}
.chip{border-radius:999px}
.ic{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:5px;opacity:.8}
.sheet{border-radius:22px}
.thumb{border-radius:14px}
/* menu stays at the very top, under the app name */
.stickyTop{position:sticky;top:0;z-index:30;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.top{position:relative;border-bottom:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}
.nav{position:relative;left:auto;right:auto;bottom:auto;border-radius:0;border:0;border-top:1px solid var(--bd);box-shadow:none;padding:4px 8px 6px;background:transparent}
.nav button{min-height:50px;padding:4px 0}
.nav svg{width:20px;height:20px}
.toast{bottom:calc(28px + env(safe-area-inset-bottom,0px))!important}
/* ---- design pass ---- */
button{min-height:44px;transition:transform .12s ease,opacity .12s ease}
button:active{transform:scale(.97);opacity:.9}
body.light .card{border-color:#dfe3ee}
.thumb{border:2px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.nav button.on::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:3px;background:var(--s)}
.toast.show{border-color:var(--ok)}
.badge.b-ok::before{content:'✓ '}
.badge.b-warn::before{content:'! '}
.badge.b-sub::before{content:'… '}
.badge.b-bad::before{content:'✕ '}
.badge.b-s::before,.badge.b-p::before{content:''}
/* ---- member rows (admin home) ---- */
.mrow{padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:active{opacity:.85}
.grow{min-width:0}
input[type=date]{min-width:0;width:100%;-webkit-appearance:none;appearance:none}
details.sec{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin:12px 0;padding:14px 16px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;color:var(--mut,inherit)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:'›';font-size:22px;opacity:.6;transition:transform .2s;transform:rotate(90deg)}
details.sec:not([open])>summary::after{transform:rotate(0deg)}
details.sec.danger{border-color:rgba(248,113,113,.45)}
details.sec.danger>summary{color:var(--bad)}
details.sec .secBody{margin-top:12px}
#imgBox{z-index:2147483640;padding:0;background:rgba(0,0,0,.92)}
/* pay-slip viewer and confirm box must sit above the member popup */
#sheet{z-index:2147483650}
#imgBox .viewBar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
#imgBox .viewBar .ghost{background:rgba(255,255,255,.18);color:#fff;min-width:48px;min-height:48px;border-radius:50%;font-size:20px;font-weight:900;padding:0 12px}
#vBack{font-size:0}
#vBack::before{content:'✕';font-size:22px;font-weight:900}
#imgBig{max-width:100vw;max-height:86vh;width:auto;height:auto;object-fit:contain;border-radius:0;touch-action:pinch-zoom}
#fMsg.err{color:#e5484d;font-weight:700}
#memberList .mhead{display:flex;align-items:center;gap:12px}
.mav{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.mname{font-weight:800;font-size:16px}
.mchip{font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap;flex:none}
.mchip.g{background:#e2f7ef;color:#1b8a64}
.mchip.r{background:#fde7e7;color:#c24141}
.mbar{height:8px;background:var(--bd);border-radius:8px;margin:12px 0 6px;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--s));border-radius:8px}
.gh{font-size:13px;color:var(--sub);font-weight:700;margin:20px 6px 8px}
/* member popup: close button stays small, popup never goes past the top of the screen */
#memBox{padding:24px 16px}
#memBox .sheet{max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px)!important}
#memBox .sheet > .row.between{position:sticky;top:-16px;z-index:3;background:var(--card);padding:6px 0 10px;margin-top:-16px}
#memBox .row.between > button{flex:none;min-height:40px;padding:0 14px;white-space:nowrap}
/* member cards in the control panel: chip wraps under the name on narrow screens */
#memberList .mhead{flex-wrap:wrap}
#memberList .mhead .grow{flex:1 1 150px}
#memberList .mhead .mchip{margin-left:auto}
/* new-entry popup */
#entryBox{padding:24px 16px}
#entryBox .sheet{width:100%;max-width:520px;max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;padding:16px}
#entryBody > .card{margin:0;box-shadow:none;border:0;padding:0;background:transparent}
#entryBody > .card h3{display:none}
#entryBox .entryClose{flex:0 0 42px;width:42px;min-width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;font-size:18px;font-weight:800;line-height:1}
@media (max-width:600px){
  #entryBox{padding:0;align-items:flex-end}
  #entryBox .sheet{max-width:100%;border-radius:22px 22px 0 0;max-height:calc(100dvh - 24px);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
}
/* info popup (ⓘ) */
#infoBox{padding:24px 16px}
#infoBox .sheet{width:100%;max-width:520px;max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;padding:16px}
#entryBody > .card{margin:0;box-shadow:none;border:0;padding:0;background:transparent}
#entryBody > .card h3{display:none}
#infoBox .entryClose{flex:0 0 42px;width:42px;min-width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;font-size:18px;font-weight:800;line-height:1}
@media (max-width:600px){
  #infoBox{padding:0;align-items:flex-end}
  #infoBox .sheet{max-width:100%;border-radius:22px 22px 0 0;max-height:calc(100dvh - 24px);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
}
/* member popup on phones: bottom sheet, full width, name takes its own row */
@media (max-width:600px){
  #memBox{padding:0;align-items:flex-end}
  #memBox .sheet{max-width:100%;border-radius:22px 22px 0 0;max-height:calc(100dvh - 24px)!important;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
  #memBox .mgrid{grid-template-columns:1fr 1fr}
  #memBox .mgrid .mf:first-child{grid-column:1/-1}
  #memBox .mav{width:48px;height:48px;font-size:19px}
  #memBox .hero .big{font-size:clamp(30px,10vw,40px)}
  #memBox .card{padding:14px}
  #memBox .row.between{gap:10px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login hidden">

/* In-app sheet: replaces prompt() and confirm() */
function sheet({ title, input = true, value = '', type = 'text', ph = '', okText, raw = false }) {
  return new Promise(resolve => {
    $('shTitle').innerText = title;
    const i = $('shIn');
    i.classList.toggle('hidden', !input);
    i.type = type; i.value = value; i.placeholder = ph;
    $('shCancel').innerText = t('cancel');
    $('shOk').innerText = okText || t('ok');
    $('sheet').classList.remove('hidden');
    openLayer('sheet');
    if (input) setTimeout(() => i.focus(), 50);
    const done = v => {
      dropLayer('sheet');
      $('sheet').classList.add('hidden');
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // closes the iPhone keyboard
      $('shOk').onclick = null; $('shCancel').onclick = null; i.onkeydown = null;
      resolve(v);
    };
    const val = () => (raw ? i.value : i.value.trim());
    $('shOk').onclick = () => done(input ? val() : true);
    $('shCancel').onclick = () => done(input ? null : false);
    i.onkeydown = e => { if (e.key === 'Enter') done(val()); };
  });
}

function allEmails() { return members.map(m => m.email); }
function calc(list = scoped()) {
  const em = allEmails();
  const tB = list.reduce((a, x) => a + num(x.amount), 0);
  const tD = em.reduce((a, e) => a + daysOf(e), 0);
  return { em, tB, tD, rate: tD > 0 ? tB / tD : 0 };
}
/* Rate: manager computes it live; members read the manager's published summary */
function currentRate() { const c = calc(); return c.tD > 0 ? c.rate : null; } // null until someone has days
function balOf(e, rate) { return bazarOf(e) + depOf(e) - num(rate) * daysOf(e); }
function balTag(b) {
  const pos = b >= 0;
  return `<span class="badge ${pos ? 'b-ok' : 'b-bad'}">${pos ? '↑' : '↓'} ${pos ? t('refund') : t('due')}: ${Math.round(Math.abs(b))}</span>`;
}
const hueOf = e => { let h = 0; for (const c of e) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

/* Logout also wipes the offline Firestore cache, so the next person on this device cannot see cached data */
async function logout() {
  try {
    unsubs.forEach(u => u()); unsubs = [];
    if (adminSess) await adminSess.auth().signOut().catch(() => {});
    await auth.signOut();
    await db.terminate();       // release the Firestore instance before clearing its cache
    await db.clearPersistence();

}

/* ===== Back button: closes the top window first (popup, pay-slip viewer, confirm box), then goes to Home ===== */
const layers = [];   // open windows, newest last
function openLayer(name) {
  if (layers.some(l => l.name === name)) return;
  layers.push({ name });
  history.pushState({ layer: name }, '');
}
/* called by the window's own close button: removes it and drops the history entry we added */
let ignorePop = 0;   // popstate events caused by our own history.back() calls
function dropLayer(name) {
  const i = layers.map(l => l.name).lastIndexOf(name);
  if (i < 0) return;
  layers.splice(i, 1);
  ignorePop++;
  history.back();
}
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  const top = layers.pop();
  if (top) {
    if (top.name === 'memBox') closeMember();
    else if (top.name === 'imgBox') closeImg();
    else if (top.name === 'entryBox') closeEntryPop();
    else if (top.name === 'infoBox') closeInfo();
    else if (top.name === 'sheet') { const b = $('shCancel'); if (b && b.onclick) b.onclick(); }
    return;
  }
  if (page !== 'home') go('home', true);
});
function go(p, fromHistory = false) {
  if (p === 'admin' && !isMgr) { unlockAdmin(); return; }
  if (!fromHistory && p !== page) history.pushState({ page: p }, '');
  page = p;
  Object.entries(PAGES).forEach(([k, id]) => $(id).classList.toggle('hidden', k !== p));
  render();
  window.scrollTo(0, 0);
  // iPhone keeps the page offset after the password keyboard closes; scroll to the top again once it settles
  if (p === 'admin') setTimeout(() => window.scrollTo(0, 0), 350);
}

/* Members see the Admin tab; opening it asks for the admin password. Signing in as admin
   switches this device to the admin account (Firebase checks the password; wrong password changes nothing). */
async function unlockAdmin() {
  if (isMgr) { go('admin'); return; }
  const pw = await sheet({ title: t('enterAdminPw'), type: 'password', raw: true });
  if (!pw) return;
  let sess = null;
  try {
    sess = firebase.initializeApp(FB_CONFIG, 'adminSess' + Date.now());
    await sess.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); // admin session lives in memory only
    await sess.auth().signInWithEmailAndPassword(MANAGER, pw);
  } catch (e) {
    if (sess) sess.delete().catch(() => {});
    toast(t('wrongPw'), true); return;
  }
  if (adminSess) adminSess.delete().catch(() => {});
  adminSess = sess;
  adminDb = sess.firestore();   // no offline cache for the admin session
  adminUnlocked = true;
  isMgr = true;
  startAdminListeners();
  go('admin');
}

/* ===== Pay-slip photos live in slips/{entryId}, not in entries ===== */
const slipCache = {};   // id -> data URL, or null when no slip exists
const slipPending = {};
function getSlip(id) {
  if (id in slipCache) return Promise.resolve(slipCache[id]);
  if (!slipPending[id]) {
    slipPending[id] = (isMgr ? ADB() : db).collection('slips').doc(id).get()
      .then(s => { slipCache[id] = s.exists ? s.data().data : null; return slipCache[id]; })
      .catch(() => undefined) // permission/network error: not cached, retried on next render
      .finally(() => { delete slipPending[id]; });
  }
  return slipPending[id];
}
function clearSlipCache() { Object.keys(slipCache).forEach(k => delete slipCache[k]); }
/* Placeholder for a slip; hydrateSlips() swaps it for the image once loaded */
function thumbFor(x) {
  if (x.photo) return `<img class="thumb" src="${esc(x.photo)}" alt="" onclick="openImg(this.src)">`; // legacy field, before migration
  return `<div class="thumb slipBox" data-slip="${esc(x.id)}" title="${t('viewSlip')}"></div>`;
}
function hydrateSlips() {
  document.querySelectorAll('.slipBox[data-slip]').forEach(el => {
    const id = el.dataset.slip;
    getSlip(id).then(src => {
      if (!el.isConnected || src === undefined) return;
      if (!src) { el.className = 'thumb noslip'; el.title = t('needSlip'); el.innerText = '!'; return; }
      const img = document.createElement('img');
      img.className = 'thumb'; img.alt = ''; img.src = src; img.title = t('viewSlip');
      img.onclick = () => openImg(src);
      el.replaceWith(img);
    });
  });
}

/* Manager publishes totals so members can see DUE / REFUND */
function pushSummary(c) {
  const key = [c.tB.toFixed(2), c.tD, c.rate.toFixed(4)].join('|');
  if (key === lastSum) return;
  lastSum = key;
  ADB().collection('summary').doc('main')
    .set({ tB: c.tB, tD: c.tD, rate: c.rate, updated: Date.now() })
    .catch(() => {});
}

/* plain-language reasons for a member's balance (shown in the ⓘ info and the popup) */
function explainLines(email, rate) {
  const bn = lang === 'bn';
  if (rate == null) return [bn ? 'দিন যোগ হলে হিসাব দেখা যাবে।' : 'The balance shows once days are set.'];
  const c = calc(), n = c.em.length || 1;
  const perHead = c.tB / n, avgDays = c.tD / n;
  const b = bazarOf(email), d = depOf(email), days = daysOf(email), nm = nameOf(email);
  const diff = b - perHead;
  const L = [];
  if (Math.abs(diff) < 0.005) L.push(bn ? `${nm} বাজার ৳${f2(b)} দিয়েছে, প্রতি সদস্যের ভাগের সমান।` : `You paid ৳${f2(b)}, equal to the share per member.`);
  else if (diff > 0) L.push(bn ? `${nm} বাজার ৳${f2(b)} দিয়েছে, ভাগের (৳${f2(perHead)}) চেয়ে ৳${f2(diff)} বেশি। এই টাকা ${nm}-কে ফেরত দেওয়া হবে।` : `You paid ৳${f2(b)}, ৳${f2(diff)} more than the share (৳${f2(perHead)}). This is added back to you.`);
  else L.push(bn ? `${nm} বাজার ৳${f2(b)} দিয়েছে, ভাগের (৳${f2(perHead)}) চেয়ে ৳${f2(-diff)} কম। এই টাকা ${nm}-কে দিতে হবে।` : `You paid ৳${f2(b)}, ৳${f2(-diff)} less than the share (৳${f2(perHead)}). You owe this.`);
  L.push(d > 0 ? (bn ? `${nm}-এর জমা ৳${f2(d)} আছে, তাই হিসাবে যোগ হয়েছে।` : `Deposit of ৳${f2(d)} is added to the balance.`) : (bn ? 'কোনো জমা নেই।' : 'No deposit.'));
  const dayTxt = days === Math.round(avgDays) ? (bn ? 'গড়ের সমান' : 'same as the average') : days < avgDays ? (bn ? 'গড়ের চেয়ে কম, তাই খাওয়ার খরচ কম' : 'below average, so meal cost is lower') : (bn ? 'গড়ের চেয়ে বেশি, তাই খাওয়ার খরচ বেশি' : 'above average, so meal cost is higher');
  L.push(bn ? `${nm} ${days} দিন খেয়েছে (মেসের গড় ${avgDays.toFixed(1)} দিন), ${dayTxt}।` : `You had ${days} days (mess average ${avgDays.toFixed(1)}), ${dayTxt}.`);
  L.push(bn ? `${nm}-এর খাওয়ার খরচ = ${days} দিন × ৳${f2(rate)} = ৳${f2(days * rate)}।` : `Meal cost = ${days} days × ৳${f2(rate)} = ৳${f2(days * rate)}.`);
  return L;
}
/* same lines, but the deposit and days lines are flagged red when they differ from the default (no deposit, 30 days) */
function explainItems(email, rate) {
  const lines = explainLines(email, rate);
  if (rate == null) return lines.map(t => ({ t, red: false }));
  const d = depOf(email), days = daysOf(email);
  return lines.map((t, i) => ({ t, red: (i === 1 && d > 0) || (i === 2 && days !== 30) }));
}

function explain(email) {

const cntOf = e => scoped().filter(x => x.memberEmail === e).length;   // entries in the month being viewed

function entryRow(x) {
  const own = x.memberEmail === me;
  const mine = isMgr || own;
  const locked = x.status === 'approved';
  const lockTxt = `<span class="sub">🔒 ${t('locked')}</span>`;
  const mgrEdit = `<button class="ghost" onclick="startEdit('${x.id}')">${t('edit')}</button><button class="bad" onclick="delEntry('${x.id}')">${t('del')}</button>`;
  const ownEdit = `<button class="ghost" onclick="startEdit('${x.id}')">${t('edit')}</button><button class="bad" onclick="delEntry('${x.id}')">${t('del')}</button>`;
  const approveBtn = isMgr && !locked ? `<button class="pri" onclick="approve('${x.id}')">✓ ${t('approve')}</button>` : '';
  let acts = '';
  if (isClosed(x)) {
    acts = `<span class="sub">🔒 ${lang === 'bn' ? 'মাস বন্ধ' : 'Month closed'}</span>`;
  } else if (isMgr) {
    acts = approveBtn + (locked ? lockTxt : '') + mgrEdit;   // admin: approve any entry (own or member's), edit/delete always
  } else if (own) {
    acts = locked ? lockTxt + (isMgr ? mgrEdit : '') : ownEdit;   // admin can still edit/delete approved entries
  } else if (!isMgr) {
    acts = '';
  } else if (locked) {
    acts = lockTxt + mgrEdit;   // admin: edit / delete even after approval
  } else {
    acts = mgrEdit;
  }
  const who = (isMgr || !mine) ? `<div class="sub">${esc(nameOf(x.memberEmail))}</div>` : '';
  const shown = mine ? thumbFor(x) : `<div class="thumb" style="display:grid;place-items:center">🧾</div>`;
  return `<div class="entry">${shown}<div class="grow">
    <div class="row between"><b class="num">${f2(x.amount)}</b><span class="badge ${STATUS_CLS[x.status] || 'b-sub'}">${t(x.status)}</span></div>
    <div class="sub">${CAL}${fmtDate(x.date)}${x.note ? ' · ' + esc(x.note) : ''}</div>${who}
    <div class="acts">${acts}</div></div></div>`;
}

/* Entry form (shared by members and manager) */
function formErr(m) { const e = $('fMsg'); e.innerText = m; e.classList.add('err'); }
function resetForm() {
  editId = '';
  $('fAmt').value = ''; $('fNote').value = ''; $('fPhoto').value = ''; $('fPrev').innerHTML = '';
  $('fDate').value = today();
  $('fTitle').innerText = t('addEntry');

}
function startEdit(id) {
  const x = entries.find(e => e.id === id); if (!x) return;
  closeMember();   // edit happens in the Entries form, so close the member popup that sits on top of it
  editId = id;
  $('fDate').value = x.date; $('fAmt').value = x.amount; $('fNote').value = x.note || ''; $('fPhoto').value = '';
  $('fPrev').innerHTML = '';
  if (x.photo) $('fPrev').innerHTML = `<img src="${x.photo}" class="thumb" alt="">`;
  else getSlip(id).then(src => { if (src && editId === id) $('fPrev').innerHTML = `<img src="${src}" class="thumb" alt="">`; });
  $('fTitle').innerText = t('editEntry');
  $('fCancel').classList.remove('hidden');
  $('fMsg').innerText = ''; $('fMsg').classList.remove('err');
  openEntryPop(true);
}
function compress(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 800 / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function saveEntry() {
  const date = $('fDate').value, amt = num($('fAmt').value), note = $('fNote').value.trim();
  const f = $('fPhoto').files[0];
  if (!date || !(amt > 0)) { formErr(t('needDateAmt')); return; }
  const oldE = editId ? entries.find(e => e.id === editId) : null;
  if (closedMonths.includes(String(date).slice(0, 7)) || (oldE && isClosed(oldE))) {
    formErr(lang === 'bn' ? 'এই মাস বন্ধ আছে' : 'This month is closed'); return;
  }
  if (!f && !editId) { formErr(t('needSlip')); return; }
  $('fMsg').innerText = '…'; $('fMsg').classList.remove('err');
  try {
    const photo = f ? await compress(f) : null;
    const W = isMgr ? ADB() : db;
    if (editId) {
      const upd = { date, amount: amt, note };
      if (!isMgr) { upd.status = 'submitted'; upd.reason = ''; } // member edits go back to review
      await W.collection('entries').doc(editId).update(upd);
      if (photo) {
        await W.collection('slips').doc(editId).set({ data: photo });
        slipCache[editId] = photo;
      }
    } else {
      // entry first (the slip rule checks that the entry exists), then the photo
      const who = isMgr && $('fMember') ? $('fMember').value : me;
      const ref = await W.collection('entries').add({ memberEmail: who, date, amount: amt, note, status: 'submitted', reason: '', createdAt: Date.now() });
      try {
        await W.collection('slips').doc(ref.id).set({ data: photo });
        slipCache[ref.id] = photo;
      } catch (e) {
        await ref.delete().catch(() => {}); // no entry without its pay slip
        throw e;
      }
    }
    resetForm();
    toast(t('saved'));
    if ($('entryBox') && !$('entryBox').classList.contains('hidden')) closeEntryPop();
  } catch (e) { formErr(t('errPrefix') + e.message); }
}

/* keeps values the admin typed (and has not saved) when the member cards are redrawn */
function collectMemKeep() {
  const out = {};
  document.querySelectorAll('#memberList .mcard').forEach(c => {
    ['mn', 'md', 'mp'].forEach(k => {
      const el = c.querySelector('.' + k);
      if (el && el.value !== el.dataset.orig) (out[c.dataset.email] = out[c.dataset.email] || {})[k] = el.value;
    });
  });
  return out;
}
function applyMemKeep(keep) {
  Object.entries(keep).forEach(([email, vals]) => {
    const c = [...document.querySelectorAll('#memberList .mcard')].find(x => x.dataset.email === email);
    if (c) Object.entries(vals).forEach(([k, v]) => { const el = c.querySelector('.' + k); if (el) el.value = v; });
  });
}

async function addMember() {
  const email = $('nEmail').value.trim().toLowerCase(), name = $('nName').value.trim(), pw = $('nPw').value;
  if (!email.includes('@')) { toast(t('memberEmail'), true); return; }
  try {
    // create the login with a second Firebase app, so the admin stays signed in
    let existed = false;
    if (pw) {
      if (pw.length < 6) { toast(t('pwShort'), true); return; }
      const sec = firebase.initializeApp(FB_CONFIG, 'userMaker' + Date.now());
      try {
        await sec.auth().createUserWithEmailAndPassword(email, pw);
      } catch (e) {
        if (e.code !== 'auth/email-already-in-use') throw e;
        existed = true;   // login was already there: the new password was NOT set
      } finally {
        await sec.auth().signOut();
        await sec.delete();
      }
    }
    const ref = ADB().collection('members').doc(email);
    const s = await ref.get();
    const fallback = email.split('@')[0].toUpperCase();
    if (s.exists) await ref.update({ name: name || s.data().name || fallback });
    else await ref.set({ email, name: name || fallback, days: 30, deposit: 0 });
    $('nEmail').value = ''; $('nName').value = ''; $('nPw').value = '';

  } catch (e) { showErr(e); }
}

async function changePassword() {

    toast(wrong ? t('wrongPw') : t('errPrefix') + e.message, true);

    clearSlipCache();
    await ADB().collection('summary').doc('main').set({ tB: 0, tD: 0, rate: 0, updated: Date.now() });

async function backupJSON() {
  try {
    const sSnap = await ADB().collection('slips').get(); // admin can read all slips
    const slips = sSnap.docs.map(d => ({ id: d.id, data: d.data().data }));
    const data = { exported: new Date().toISOString(), members, entries: entries.map(x => { const { id, ...r } = x; return { id, ...r }; }), slips };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'mess-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();

async function restoreJSON(file) {
  if (!file) return;
  const ok = await sheet({ title: lang === 'bn' ? 'ব্যাকআপ থেকে ফিরিয়ে আনবে? একই ID-র ডেটা বদলে যাবে।' : 'Restore backup? Matching records will be overwritten.', input: false, okText: lang === 'bn' ? 'ফিরিয়ে আনো' : 'Restore' });
  if (!ok) { $('restoreFile').value = ''; return; }
  try {
    const d = JSON.parse(await file.text());
    const small = [], slipOps = [];
    (d.members || []).forEach(m => small.push({ ref: ADB().collection('members').doc(m.email), data: (({ email, ...r }) => r)(m) }));
    (d.entries || []).forEach(x => {
      const { id, photo, ...r } = x; // old backups carry the photo inside the entry: move it to slips
      small.push({ ref: ADB().collection('entries').doc(id), data: { ...r, photo: firebase.firestore.FieldValue.delete() } });
      if (photo) slipOps.push({ ref: ADB().collection('slips').doc(id), data: { data: photo } });
    });
    (d.slips || []).forEach(s => slipOps.push({ ref: ADB().collection('slips').doc(s.id), data: { data: s.data } }));
    for (let i = 0; i < small.length; i += 400) {
      const batch = ADB().batch();
      small.slice(i, i + 400).forEach(o => batch.set(o.ref, o.data, { merge: true }));
      await batch.commit();
    }
    // photos can be ~200 KB each, so keep slip batches small (Firestore caps a batch at 10 MiB)
    for (let i = 0; i < slipOps.length; i += 10) {
      const batch = ADB().batch();
      slipOps.slice(i, i + 10).forEach(o => batch.set(o.ref, o.data));
      await batch.commit();
    }
    clearSlipCache();
    toast(t('saved')); logAct('Backup restored');
  } catch (e) { showErr(e); }
  $('restoreFile').value = '';
}
/* One-time: move pay-slip photos from entries.photo into slips/{id} */
async function migrateSlips() {
  const ok = await sheet({ title: lang === 'bn' ? 'পুরোনো ছবি slips-এ সরাবে? একবারই চালাও।' : 'Move old photos to slips? Run once.', input: false, okText: lang === 'bn' ? 'সরাও' : 'Move' });
  if (!ok) return;
  try {
    const snap = await ADB().collection('entries').get();
    const todo = snap.docs.filter(d => d.data().photo);
    if (!todo.length) { toast(lang === 'bn' ? 'কোনো পুরোনো ছবি নেই' : 'No old photos found'); return; }
    for (let i = 0; i < todo.length; i += 10) {
      const chunk = todo.slice(i, i + 10);
      // copy first, and only then remove the photo from the entry
      const copy = ADB().batch();
      chunk.forEach(d => copy.set(ADB().collection('slips').doc(d.id), { data: d.data().photo }));
      await copy.commit();
      const strip = ADB().batch();
      chunk.forEach(d => strip.update(d.ref, { photo: firebase.firestore.FieldValue.delete() }));
      await strip.commit();
    }
    clearSlipCache();
    toast(t('saved')); logAct('Photos moved to slips · ' + todo.length);
  } catch (e) { showErr(e); }
}
let migrating = false;
/* Moves legacy photos (entries.photo) into slips/{id}, admin only. Runs by itself, so no old photo stays readable by members. */
async function autoMigrate() {
  if (migrating) return; migrating = true;
  try {
    const snap = await ADB().collection('entries').get();
    const todo = snap.docs.filter(d => d.data().photo);
    for (let i = 0; i < todo.length; i += 10) {
      const chunk = todo.slice(i, i + 10);
      const copy = ADB().batch();   // copy first, remove from the entry only after the copy succeeded
      chunk.forEach(d => copy.set(ADB().collection('slips').doc(d.id), { data: d.data().photo }));
      await copy.commit();
      const strip = ADB().batch();
      chunk.forEach(d => strip.update(d.ref, { photo: firebase.firestore.FieldValue.delete() }));
      await strip.commit();
    }
    if (todo.length) { clearSlipCache(); logAct('Photos moved to slips (auto) · ' + todo.length); }
  } catch (e) { /* tried again on the next render */ }
  finally { migrating = false; }
}
function exportCSV() {
  const list = scoped().slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['date', 'member', 'name', 'amount', 'note', 'status', 'reason'].join(',')]
    .concat(list.map(x => [x.date, x.memberEmail, nameOf(x.memberEmail), x.amount, x.note, x.status, x.reason].map(q).join(',')));
  const blob = new Blob(['\ufeff' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mess-' + (month === 'all' ? 'all' : month) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function openMember(email) {
  // keep days/deposit the admin is typing when this modal is redrawn by a live update
  const oldD = $('mdDays'), oldP = $('mdDep');
  const sameM = $('memBody').dataset.email === email;
  const keepD = sameM && oldD && oldD.value !== oldD.dataset.orig ? oldD.value : null;
  const keepP = sameM && oldP && oldP.value !== oldP.dataset.orig ? oldP.value : null;
  const oldN = $('mdName');
  const keepN = sameM && oldN && oldN.value !== oldN.dataset.orig ? oldN.value : null;
  const oldDet = $('memBody').querySelector('details');
  const keepOpen = sameM && oldDet ? oldDet.open : false;
  memOpen = email;
  const all = scoped().filter(x => x.memberEmail === email).sort(byNewest);   // same month scope as the home page
  const bazar = bazarOf(email);
  const rate = currentRate();
  const bal = rate == null ? null : balOf(email, rate);
  const cc = calc();
  const perHead = cc.em.length ? cc.tB / cc.em.length : 0;
  const bn = lang === 'bn';
  const pos = bal != null && bal >= 0;
  const tone = bal == null ? 'var(--sub)' : pos ? '#22c55e' : 'var(--bad)';
  const row = (label, val, extra = '') => `<div class="row between" style="padding:7px 0;${extra}"><span class="sub">${label}</span><b class="num">${val}</b></div>`;
  $('memTitle').innerText = bn ? 'সদস্যের হিসাব' : 'Member account';
  $('memBack').innerText = '← ' + t('back');
  $('memBody').dataset.email = email;
  $('memBody').innerHTML = `
    <div class="row" style="flex-wrap:nowrap;gap:12px;margin-bottom:12px">
      <div class="mav" style="background:linear-gradient(135deg,var(--p),var(--s))">${esc(nameOf(email).charAt(0))}</div>
      <div class="grow" style="min-width:0"><div class="mname">${esc(nameOf(email))}</div><div class="sub" style="word-break:break-all">${esc(email)} · ${all.length} ${bn ? 'টি এন্ট্রি' : 'entries'}</div></div>
    </div>
    ${isMgr ? `<details class="sec" style="margin:0 0 14px"><summary>${bn ? 'এডিট / মুছো' : 'Edit / delete'}</summary><div class="secBody">
      <div class="mgrid">
        <label class="mf"><span>${t('nameLbl')}</span><input id="mdName" type="text" data-orig="${esc(nameOf(email))}" value="${esc(nameOf(email))}"></label>
        <label class="mf"><span>${t('days')}</span><input id="mdDays" type="text" inputmode="numeric" data-orig="${daysOf(email)}" value="${daysOf(email)}"></label>
        <label class="mf"><span>${t('deposit')}</span><input id="mdDep" type="text" inputmode="decimal" data-orig="${depOf(email)}" value="${depOf(email)}"></label>
      </div>
      ${email !== MANAGER ? `<button class="ghost" style="width:100%;margin-top:12px" onclick="toggleAdmin('${esc(email)}', ${!isAdminRow(email)})">${isAdminRow(email) ? (bn ? 'অ্যাডমিন থেকে সরাও' : 'Remove admin rights') : (bn ? 'অ্যাডমিন বানাও' : 'Make admin')}</button>` : ''}
      <div class="row" style="margin-top:12px">
        <button class="pri grow" onclick="saveMemberFields('${esc(email)}')">${t('save')}</button>
        <button class="bad" onclick="closeMember(); removeMember('${esc(email)}')">${t('del')}</button>
      </div>
    </div></details>` : ''}
    <div class="hero" style="margin-bottom:14px">
      <div class="sub">${bal == null ? (bn ? 'দিন যোগ হলে হিসাব দেখা যাবে' : 'Shows once days are set') : pos ? (bn ? 'ফেরত পাবে' : 'Gets back') : (bn ? 'বাকি (দিতে হবে)' : 'Due')}</div>
      <div class="big" style="color:${tone}">${bal == null ? '—' : '৳ ' + f2(Math.abs(bal))}</div>
    </div>
    ${rate != null ? `<div class="card" style="margin:0 0 14px">
      <h3>${bn ? 'হিসাব কীভাবে হলো' : 'How it adds up'}</h3>
      ${row(bn ? 'মেসের মোট বাজার' : 'Total mess bazar', f2(cc.tB))}
      ${row(bn ? 'জনপ্রতি ভাগ' : 'Per person share', f2(perHead))}
      ${row(bn ? 'এঁর বাজার' : 'Bazar paid', f2(bazar), 'border-top:1px solid var(--bd)')}
      ${row(bn ? 'জমা' : 'Deposit', '+ ' + f2(depOf(email)))}
      ${row(bn ? `খাওয়া (${daysOf(email)} দিন × ${f2(rate)})` : `Meals (${daysOf(email)} days × ${f2(rate)})`, '− ' + f2(daysOf(email) * rate))}
      <div class="row between" style="padding:10px 0 2px;border-top:1px solid var(--bd)"><b>${pos ? (bn ? 'ফেরত পাবে' : 'Gets back') : (bn ? 'বাকি (দিতে হবে)' : 'Due')}</b><b class="num" style="color:${tone};font-size:18px">${f2(Math.abs(bal))}</b></div>
    </div>` : ''}
    <div class="card" style="margin:0 0 14px">
      <h3>ⓘ ${bn ? 'কেন এমন হলো' : 'Why this amount'}</h3>
      ${explainItems(email, rate).map(x => `<div style="padding:7px 0;border-top:1px solid var(--bd);font-size:14px;${x.red ? 'color:var(--bad);font-weight:700' : ''}">${esc(x.t)}</div>`).join('')}
    </div>
    <div class="card" style="margin:0 0 14px">
      <h3>${bn ? 'বাজার ও পে-স্লিপ' : 'Bazar & pay slips'} <span class="sub">(${all.length})</span></h3>
      ${all.length ? all.map(entryRow).join('') : `<div class="empty">${t('noEntries')}</div>`}
    </div>
    <button class="ghost" style="width:100%;margin-top:4px" onclick="closeMember()">← ${t('back')}</button>
`;
  if (keepD !== null) $('mdDays').value = keepD;
  if (keepP !== null) $('mdDep').value = keepP;
  if (keepN !== null && $('mdName')) $('mdName').value = keepN;
  const newDet = $('memBody').querySelector('details');
  if (newDet && keepOpen) newDet.open = true;
  $('memBox').classList.remove('hidden');
  openLayer('memBox');
  hydrateSlips();
}
/* admin can give or take admin rights from any member; the main admin account cannot be changed here */
async function toggleAdmin(email, make) {
  if (email === MANAGER) return;
  const who = nameOf(email);
  const ok = await sheet({
    title: make
      ? (lang === 'bn' ? `${who} কে অ্যাডমিন বানাবে? সে সব কিছু দেখতে ও বদলাতে পারবে।` : `Make ${who} an admin? They get full access.`)
      : (lang === 'bn' ? `${who} এর অ্যাডমিন অধিকার সরাবে?` : `Remove admin rights from ${who}?`),
    input: false, okText: make ? (lang === 'bn' ? 'অ্যাডমিন বানাও' : 'Make admin') : (lang === 'bn' ? 'সরাও' : 'Remove')
  });
  if (!ok) return;
  ADB().collection('members').doc(email).set({ admin: make }, { merge: true })
    .then(() => { toast(t('saved')); logAct((make ? 'Made admin · ' : 'Removed admin · ') + email); if (memOpen) openMember(memOpen); })
    .catch(showErr);
}
function saveMemberFields(email) {
  const nm = $('mdName').value.trim();
  ADB().collection('members').doc(email).set({
    ...(nm ? { name: nm } : {}),
    days: num($('mdDays').value),
    deposit: num($('mdDep').value)
  }, { merge: true }).then(() => { toast(t('saved')); logAct('Days/deposit · ' + email + ' · ' + num($('mdDays').value) + ' / ' + num($('mdDep').value)); if (memOpen) openMember(memOpen); }).catch(showErr);
}
function closeMember() { memOpen = null; $('memBox').classList.add('hidden'); dropLayer('memBox'); }
